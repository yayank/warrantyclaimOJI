<style>
:root{
  --ground:#f2f5f6; --surface:#ffffff; --surface-2:#f8fafb;
  --line:#d7dee1; --line-soft:#e6ebed;
  --ink:#101619; --ink-2:#465055; --ink-3:#6f7c82;
  --accent:#00697a; --accent-ink:#00505e; --accent-soft:#dcedf0; --on-accent:#ffffff;
  --ok:#1f7a4d; --ok-soft:#dcefe4;
  --warn:#9a5b06; --warn-soft:#f7e8d2;
  --crit:#ab2318; --crit-soft:#f8dedb;
  --info:#2b5a86; --info-soft:#dde8f2;
  --mute-soft:#e8ecee;
  --shadow:0 1px 2px rgba(16,22,25,.05), 0 8px 24px -12px rgba(16,22,25,.18);
  --shadow-lg:0 12px 48px -12px rgba(16,22,25,.32);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#0d1315; --surface:#151d20; --surface-2:#1a2427;
    --line:#2a373b; --line-soft:#222d31;
    --ink:#e7eef0; --ink-2:#a8b6bb; --ink-3:#7d8b91;
    --accent:#54bfd0; --accent-ink:#8ad6e2; --accent-soft:#123239; --on-accent:#07171b;
    --ok:#5cc38c; --ok-soft:#123022;
    --warn:#d69a4a; --warn-soft:#33260f;
    --crit:#e8877c; --crit-soft:#3a1d1a;
    --info:#79aada; --info-soft:#16283a;
    --mute-soft:#222d31;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 12px 48px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0d1315; --surface:#151d20; --surface-2:#1a2427;
  --line:#2a373b; --line-soft:#222d31;
  --ink:#e7eef0; --ink-2:#a8b6bb; --ink-3:#7d8b91;
  --accent:#54bfd0; --accent-ink:#8ad6e2; --accent-soft:#123239; --on-accent:#07171b;
  --ok:#5cc38c; --ok-soft:#123022;
  --warn:#d69a4a; --warn-soft:#33260f;
  --crit:#e8877c; --crit-soft:#3a1d1a;
  --info:#79aada; --info-soft:#16283a;
  --mute-soft:#222d31;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 12px 48px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--ink-3)}
.dimmer{color:var(--ink-3);opacity:.55}
.tiny{font-size:11.5px;color:var(--ink-3);line-height:1.5}
.spacer{margin-left:auto}
.stack{display:flex;flex-direction:column;gap:3px;min-width:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.req{color:var(--crit)}

/* ------------------------------------------------------------- sign in */
.boot{min-height:100vh;display:grid;place-items:center;padding:32px 20px;
  background:radial-gradient(900px 420px at 50% -10%, var(--accent-soft), transparent 70%), var(--ground)}
.boot-card{width:100%;max-width:360px;display:flex;flex-direction:column;gap:20px;
  align-items:center;text-align:center}
.mark{width:44px;height:44px;border-radius:9px;background:var(--accent);position:relative}
.mark::after{content:"";position:absolute;inset:11px 10px auto 10px;height:3px;
  background:var(--surface);box-shadow:0 8px 0 var(--surface);border-radius:2px}
.boot h1{margin:0;font-size:19px;font-weight:600;letter-spacing:-.01em}
.boot p{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.boot-note{font-size:11.5px;color:var(--ink-3);line-height:1.6;max-width:44ch}
.boot-error{border:1px solid var(--crit);background:var(--crit-soft);color:var(--crit);
  border-radius:6px;padding:10px 13px;font-size:13px;width:100%}

/* -------------------------------------------------------------- chrome */
#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:14px;padding:0 16px;height:50px;flex:none;
  border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;white-space:nowrap}
.brand i{width:18px;height:18px;border-radius:3px;background:var(--accent);position:relative;flex:none}
.brand i::after{content:"";position:absolute;inset:4px 4px auto 4px;height:2px;
  background:var(--surface-2);box-shadow:0 4px 0 var(--surface-2)}
.nav{display:flex;gap:2px;margin-left:6px;overflow-x:auto}
.nav button{padding:5px 10px;border-radius:4px;font-size:13px;color:var(--ink-3);
  background:none;border:0;cursor:pointer;white-space:nowrap}
.nav button:hover{background:var(--mute-soft);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-3)}
.who span:first-child{display:none}
@media(min-width:760px){.who span:first-child{display:inline}}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);
  color:var(--accent-ink);display:grid;place-items:center;font-size:10.5px;font-weight:600;flex:none}
.view{flex:1;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}

.tester{display:flex;align-items:center;gap:11px;padding:8px 16px;font-size:12.5px;
  background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--warn);font-weight:500;
  flex-wrap:wrap}
.tester select{font:inherit;font-weight:600;border:1px solid var(--warn);border-radius:4px;
  padding:2px 6px;background:var(--surface);color:var(--warn)}

/* ------------------------------------------------------------ controls */
.btn{font-size:12.5px;font-weight:500;border-radius:5px;padding:6px 12px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink-3)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.no{border-color:var(--crit);color:var(--crit)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-3)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.block{width:100%;justify-content:center}

input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{
  font:inherit;font-size:13px;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:5px;padding:7px 9px;width:100%;
}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}
label.field{display:flex;flex-direction:column;gap:4px;min-width:0}
label.field>span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}

/* Searchable dropdown: a text box that filters a list too long to scroll. */
.combo{position:relative;min-width:0}
.combo-box{width:100%}
.combo-pop{position:absolute;z-index:55;top:calc(100% + 3px);left:0;right:0;max-height:236px;
  overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:5px;
  box-shadow:var(--shadow-lg)}
.combo-opt{display:flex;flex-direction:column;gap:1px;padding:6px 10px;font-size:13px;
  cursor:pointer;border-bottom:1px solid var(--line-soft)}
.combo-opt:last-child{border-bottom:0}
.combo-opt.on,.combo-opt:hover{background:var(--accent-soft);color:var(--accent-ink)}
.combo-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-h{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.combo-opt.on .combo-h,.combo-opt:hover .combo-h{color:inherit;opacity:.75}
.combo-more{padding:6px 10px;font-size:11.5px;color:var(--ink-3);background:var(--surface-2);
  border-top:1px solid var(--line-soft)}
.combo-none{padding:9px 11px;font-size:12px;line-height:1.55;color:var(--warn);
  background:var(--warn-soft)}
.combo-none a{color:inherit;font-weight:600}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font-size:13px;background:none;border:0;cursor:pointer;padding:8px 12px;
  color:var(--ink-3);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;
  white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs .count{font-family:"IBM Plex Mono",monospace;font-size:10.5px;background:var(--accent);
  color:var(--on-accent);border-radius:9px;padding:1px 6px;font-weight:600}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.toolbar .grow{flex:1;min-width:180px}
.seg{display:flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.seg button{padding:5px 11px;font-size:12.5px;color:var(--ink-3);background:var(--surface);
  border:0;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--accent-soft);
  color:var(--accent-ink);border-radius:20px;padding:3px 6px 3px 11px;font-weight:500}
.chip button{border:0;background:none;color:inherit;cursor:pointer;opacity:.6;padding:0 4px}

.pill{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;
  font-size:11.5px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.pill.flat::before{display:none}
.p-draft{background:var(--mute-soft);color:var(--ink-3)}
.p-sub{background:var(--warn-soft);color:var(--warn)}
.p-rev{background:var(--info-soft);color:var(--info)}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-no{background:var(--crit-soft);color:var(--crit)}
.p-wait{background:var(--accent-soft);color:var(--accent-ink)}

/* -------------------------------------------------------------- tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table.data{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
table.data th{text-align:left;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);
  white-space:nowrap;background:var(--surface-2)}
table.data td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.data tr.click{cursor:pointer}
table.data tr.click:hover td{background:var(--surface-2)}
table.data tr.sub td{background:var(--surface-2);font-size:12.5px}
table.data tr.sub td:first-child{padding-left:30px}
.caret{color:var(--ink-3);font-size:10px;width:22px;cursor:pointer;user-select:none}
.age-warn{color:var(--warn);font-weight:600}
.age-crit{color:var(--crit);font-weight:600}

.empty{padding:44px 20px;text-align:center;color:var(--ink-3);font-size:13.5px}
.skel{height:38px;border-radius:5px;background:linear-gradient(90deg,var(--mute-soft),
  var(--surface-2),var(--mute-soft));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}

/* --------------------------------------------------------------- panel */
.panel-scrim{position:fixed;inset:0;background:rgba(16,22,25,.34);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:41;
  display:flex;flex-direction:column;animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
.panel-head{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;
  flex-direction:column;gap:7px;flex:none}
.panel-head h2{margin:0;font-size:14px;font-family:"IBM Plex Mono",monospace;font-weight:600}
.panel-body{flex:1;overflow-y:auto}
.panel-sec{padding:14px 16px;border-bottom:1px solid var(--line-soft);
  display:flex;flex-direction:column;gap:9px}
.panel-sec>h3{margin:0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}
.panel-foot{padding:13px 16px;border-top:1px solid var(--line);display:flex;gap:8px;
  flex-wrap:wrap;background:var(--surface-2);flex:none}
.calc{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.7;color:var(--ink-2);
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:5px;padding:9px 11px}
.calc b{color:var(--ink)}
.check{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.check div{display:flex;align-items:center;gap:7px}
.check .yes{color:var(--ok);font-weight:700}
.check .no{color:var(--crit);font-weight:700}
.itemrow{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:5px;
  background:var(--surface-2);font-size:13px;flex-wrap:wrap}
.itemrow .nm{flex:1;min-width:120px}
.audit{display:flex;flex-direction:column;gap:8px;font-size:12px}
.audit .entry{border-left:2px solid var(--line);padding-left:9px}

/* -------------------------------------------------------------- modals */
.modal-scrim{position:fixed;inset:0;background:rgba(16,22,25,.4);z-index:50;
  display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;box-shadow:var(--shadow-lg);overflow:hidden;margin:auto}
.modal.wide{max-width:960px}
.modal.narrow{max-width:430px}
.modal-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;justify-content:space-between;gap:12px}
.modal-head h2{margin:0;font-size:15px;font-weight:600}
.modal-body{padding:18px;display:flex;flex-direction:column;gap:18px;
  max-height:70vh;overflow-y:auto}
.modal-foot{padding:13px 18px;border-top:1px solid var(--line);background:var(--surface-2);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk{display:flex;flex-direction:column;gap:9px}
.blk>h3{margin:0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}
.ro{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:7px 10px;
  font-size:13px;color:var(--ink-2)}

.lookup{border:1px solid var(--line);border-left-width:3px;border-radius:5px;padding:11px 13px;
  display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.lookup.ok{border-color:var(--ok);background:var(--ok-soft)}
.lookup.out{border-color:var(--warn);background:var(--warn-soft)}
.lookup.manual{border-color:var(--accent);background:var(--accent-soft)}
.lookup.none{border-color:var(--line);background:var(--surface-2)}
.lookup .l1{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600}
.lookup .l3{font-weight:600}
.notice{border:1px solid var(--warn);border-left-width:3px;border-radius:5px;
  background:var(--warn-soft);padding:9px 12px;font-size:12.5px;color:var(--warn)}
.notice.crit{border-color:var(--crit);background:var(--crit-soft);color:var(--crit)}
.notice.info{border-color:var(--info);background:var(--info-soft);color:var(--info)}

.partrow{display:grid;grid-template-columns:20px minmax(0,1fr) 74px minmax(0,150px) 28px;
  gap:8px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:7px 9px}
/* The row is a grid, so the combobox has to fill its cell like the old select. */
.partrow .combo{width:100%}
.partrow.bad{border-color:var(--crit)}
@media(max-width:560px){.partrow{grid-template-columns:20px minmax(0,1fr) 28px}
  .partrow .qty,.partrow .file{grid-column:2/4}}
.partrow .idx{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.filebtn{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);
  border:1px dashed var(--line);border-radius:4px;padding:4px 8px;cursor:pointer;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filebtn.has{border-style:solid;color:var(--ok);border-color:var(--ok)}
.filebtn input{display:none}
.addrow{border:1px dashed var(--line);border-radius:5px;padding:7px;text-align:center;
  font-size:12.5px;color:var(--ink-3);cursor:pointer;background:none;width:100%}

.stepper{display:flex;flex-direction:column;gap:9px}
.step{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-3)}
.step .dot{width:15px;height:15px;border-radius:50%;border:1.5px solid var(--line);flex:none}
.step.done .dot{background:var(--ok);border-color:var(--ok)}
.step.done{color:var(--ink-2)}
.step.now{font-weight:600;color:var(--ink)}
.step.now .dot{border-color:var(--accent);border-right-color:transparent;
  animation:spin .8s linear infinite}
.step.bad .dot{background:var(--crit);border-color:var(--crit)}
.step.bad{color:var(--crit);font-weight:600}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.step.now .dot{animation:none}}
.bar{height:4px;border-radius:3px;background:var(--mute-soft);overflow:hidden;flex:1;max-width:150px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}

/* --------------------------------------------------------------- batch */
.bulk{border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.bulk-head{display:flex;align-items:center;gap:10px;padding:10px 13px;background:var(--surface-2);
  border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.bulk-head .ref{font-family:"IBM Plex Mono",monospace;font-weight:600}
.claim-blk{padding:12px 13px;border-bottom:1px solid var(--line-soft);display:flex;
  flex-direction:column;gap:9px}
.claim-blk:last-child{border-bottom:0}
.warr{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);
  border:1px solid var(--line-soft);border-radius:4px;padding:5px 9px;
  font-family:"IBM Plex Mono",monospace}
.selbar{position:sticky;bottom:0;display:flex;align-items:center;gap:9px;padding:10px 13px;
  border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);font-size:12.5px;
  font-weight:500;box-shadow:var(--shadow);flex-wrap:wrap;z-index:10}
.shipgrp{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:5px;
  padding:9px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font-size:12.5px;
  background:var(--surface)}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--accent);cursor:pointer;flex:none}

/* ------------------------------------------------------------ templates */
.tpl-grid{display:grid;grid-template-columns:180px minmax(0,1fr) minmax(0,1fr);
  border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
@media(max-width:1000px){.tpl-grid{grid-template-columns:1fr}}
.tpl-list{border-right:1px solid var(--line);background:var(--surface-2)}
.tpl-list button{display:block;width:100%;text-align:left;padding:9px 12px;
  border:0;border-bottom:1px solid var(--line-soft);background:none;cursor:pointer;font-size:12.5px;
  color:var(--ink-2)}
.tpl-list button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;
  box-shadow:inset 3px 0 0 var(--accent)}
.tpl-list .tcode{font-family:"IBM Plex Mono",monospace;font-size:10.5px;display:block;
  color:var(--ink-3)}
.tpl-list button.on .tcode{color:var(--accent-ink);opacity:.75}
.tpl-col{padding:14px 16px;display:flex;flex-direction:column;gap:11px;min-width:0}
.tpl-col+.tpl-col{border-left:1px solid var(--line)}
.tpl-col>h3{margin:0;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}
.tpl-col textarea{font-family:"IBM Plex Mono",monospace;font-size:11.5px;line-height:1.75;
  min-height:280px}
.ph{display:flex;flex-wrap:wrap;gap:5px}
.ph button{font-family:"IBM Plex Mono",monospace;font-size:10.5px;border:1px solid var(--line);
  border-radius:3px;padding:2px 6px;color:var(--ink-3);background:none;cursor:pointer}
.ph button.must{border-color:var(--warn);color:var(--warn);background:var(--warn-soft);font-weight:600}
.mail{border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mail-lock{background:var(--mute-soft);padding:9px 34px 9px 12px;font-size:11.5px;
  color:var(--ink-3);position:relative;line-height:1.6}
.mail-lock .tag{position:absolute;right:7px;top:6px;font-size:9px;letter-spacing:.09em;
  text-transform:uppercase;font-weight:700;opacity:.7}
.mail-body{padding:12px;font-size:12.5px;background:var(--surface);line-height:1.6;
  white-space:pre-wrap}

/* --------------------------------------------------------------- toast */
.toast-host{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;
  flex-direction:column;gap:8px;max-width:min(380px,90vw)}
.toast{border:1px solid var(--line);border-left-width:3px;border-radius:6px;padding:10px 13px;
  background:var(--surface);box-shadow:var(--shadow-lg);font-size:13px;
  animation:pop .16s ease-out}
@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--crit)}
.toast.info{border-left-color:var(--accent)}

.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.gallery figure{margin:0;border:1px solid var(--line);border-radius:5px;overflow:hidden;
  background:var(--surface-2);cursor:pointer}
.gallery img{width:100%;height:82px;object-fit:cover;display:block}
.gallery figcaption{padding:5px 7px;font-size:10.5px;color:var(--ink-3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:70;display:grid;
  place-items:center;padding:24px;cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
</style>
