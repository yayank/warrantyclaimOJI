<script>
/* =============================================================== state */

const S = {
  token: null,
  session: null,
  reference: null,
  page: 'claims',
  tab: 'action',
  view: 'claim',            // 'claim' | 'item'
  filters: { search: '', statuses: [], warrantyTypes: [], customerId: '', partId: '',
    principal: '', from: '', to: '' },
  rows: [],
  counts: { action: 0 },
  expanded: {},
  selection: {},
  deepLink: window.APP_DEEP_LINK || {},
  master: { kind: 'users', rows: [] },
  templates: [],
  templateCode: 'DAILY_DIGEST'
};

const STATUS = {
  DRAFT: 'Draft', SUBMITTED: 'Submitted', RETURNED: 'Returned to Requester',
  IN_REVIEW: 'In Review', INTERNAL: 'Internal Verification',
  FULFILMENT: 'In Fulfilment', CLOSED: 'Closed'
};
const ITEM = {
  PENDING: 'Pending', APPROVED: 'Approved', REJECTED: 'Rejected',
  FORWARDED: 'Order Forwarded', AWAITING: 'Awaiting Part Availability', SHIPPED: 'Shipped'
};
const WARRANTY = {
  PRINCIPAL: 'Principal Warranty', OUT: 'Out of Principal Warranty',
  MANUAL: 'Manual Verification Required', INTERNAL: 'Internal Warranty'
};
const ROLE = {
  REQUESTER: 'Requester', PRODUCTION: 'Production',
  ADMIN: 'Administrator', PRINCIPAL: 'Principal', TESTER: 'Tester'
};

/* ============================================================= helpers */

function h(v) {
  return String(v === undefined || v === null ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function el(id) { return document.getElementById(id); }
function initials(name) {
  return String(name || '?').split(/\s+/).slice(0, 2)
    .map(function (p) { return p.charAt(0).toUpperCase(); }).join('');
}
function fmtDate(v) {
  if (!v) return '';
  const d = new Date(String(v).replace(' ', 'T'));
  if (isNaN(d.getTime())) return String(v);
  const m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return d.getDate() + ' ' + m[d.getMonth()] + ' ' + d.getFullYear();
}
function fmtDateTime(v) {
  if (!v) return '';
  const d = new Date(String(v).replace(' ', 'T'));
  if (isNaN(d.getTime())) return String(v);
  return fmtDate(v) + ', ' + String(d.getHours()).padStart(2, '0') + ':' +
    String(d.getMinutes()).padStart(2, '0');
}

const STATUS_CLASS = {};
STATUS_CLASS[STATUS.DRAFT] = 'p-draft';
STATUS_CLASS[STATUS.SUBMITTED] = 'p-sub';
STATUS_CLASS[STATUS.RETURNED] = 'p-sub';
STATUS_CLASS[STATUS.IN_REVIEW] = 'p-rev';
STATUS_CLASS[STATUS.INTERNAL] = 'p-wait';
STATUS_CLASS[STATUS.FULFILMENT] = 'p-wait';
STATUS_CLASS[STATUS.CLOSED] = 'p-ok';

const ITEM_CLASS = {};
ITEM_CLASS[ITEM.PENDING] = 'p-draft';
ITEM_CLASS[ITEM.APPROVED] = 'p-ok';
ITEM_CLASS[ITEM.REJECTED] = 'p-no';
ITEM_CLASS[ITEM.FORWARDED] = 'p-rev';
ITEM_CLASS[ITEM.AWAITING] = 'p-wait';
ITEM_CLASS[ITEM.SHIPPED] = 'p-ok';

function statusPill(status) {
  return '<span class="pill ' + (STATUS_CLASS[status] || 'p-draft') + '">' + h(status) + '</span>';
}
function itemPill(status) {
  return '<span class="pill ' + (ITEM_CLASS[status] || 'p-draft') + '">' + h(status) + '</span>';
}
function warrantyPill(type) {
  const cls = type === WARRANTY.PRINCIPAL ? 'p-ok'
    : type === WARRANTY.OUT ? 'p-no'
      : type === WARRANTY.INTERNAL ? 'p-rev' : 'p-wait';
  return '<span class="pill flat ' + cls + '">' + h(type) + '</span>';
}
function ageCell(days) {
  if (days === null || days === undefined) return '<span class="dim">—</span>';
  const cls = days >= 7 ? 'age-crit' : days >= 3 ? 'age-warn' : '';
  return '<span class="num ' + cls + '">' + days + ' d</span>';
}
function summaryText(s) {
  const bits = [];
  if (s.approved) bits.push(s.approved + ' approved');
  if (s.rejected) bits.push(s.rejected + ' rejected');
  if (s.pending) bits.push(s.pending + ' pending');
  if (s.advance) bits.push(s.advance + ' issued in advance');
  return bits.join(' · ');
}

function toast(message, kind) {
  const node = document.createElement('div');
  node.className = 'toast ' + (kind || 'info');
  node.textContent = message;
  el('toastHost').appendChild(node);
  setTimeout(function () { node.remove(); }, kind === 'err' ? 7000 : 3800);
}

/* ================================================================= api */

function api(action, payload) {
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || res.ok) {
          if (res && res.session) S.session = res.session;
          resolve(res ? res.data : null);
          return;
        }
        if (res.kind === 'auth') {
          S.token = null;
          showSignIn(res.error);
        }
        const err = new Error(res.error);
        err.kind = res.kind;
        err.current = res.current;
        reject(err);
      })
      .withFailureHandler(function (e) { reject(new Error(e && e.message ? e.message : String(e))); })
      .api({
        token: S.token,
        simulatedRole: S.session && S.session.isTester ? S.session.simulatedRole : null,
        action: action,
        payload: payload || {}
      });
  });
}

function fail(err) {
  toast(err && err.message ? err.message : 'Something went wrong.', 'err');
}

/* ============================================================= sign in */

function showSignIn(message) {
  el('app').hidden = true;
  el('boot').hidden = false;
  const box = el('bootError');
  if (message) { box.textContent = message; box.hidden = false; } else { box.hidden = true; }
}

/**
 * With no client ID configured, Apps Script has already established who the
 * visitor is: the page cannot load without a Google account. There is nothing to
 * sign into, so the portal opens straight away.
 */
function startWithBuiltInIdentity() {
  el('signOut').hidden = true;
  api('session.bootstrap', {}).then(function (data) {
    S.session = data.session;
    S.reference = data.reference;
    el('boot').hidden = true;
    el('app').hidden = false;
    applyDeepLink();
    renderChrome();
    navigate(S.page);
  }).catch(function (err) {
    showSignIn(err.message);
  });
}

window.onGoogleLibraryLoad = function () {
  // Quotes get pasted along with the value often enough to be worth stripping
  // rather than reporting as invalid.
  const clientId = String(window.APP_CLIENT_ID || '').trim().replace(/^["']|["']$/g, '').trim();

  if (!clientId) return;  // handled at load time by startWithBuiltInIdentity

  // Catching the shape here turns Google's "Error 401: invalid_client" — which
  // appears on Google's own page, with nothing pointing back at this portal —
  // into a message that names the sheet and the cell to fix.
  if (!/^[0-9]+-[A-Za-z0-9_]+\.apps\.googleusercontent\.com$/.test(clientId)) {
    showSignIn('The Google Client ID in the Settings sheet does not look valid: "' + clientId +
      '". It should end in .apps.googleusercontent.com. Correct Settings!GoogleClientId, ' +
      'then run clearCache() from the Apps Script editor — settings are cached for five minutes.');
    return;
  }
  google.accounts.id.initialize({
    client_id: clientId,
    callback: function (response) { signIn(response.credential); },
    auto_select: true
  });
  google.accounts.id.renderButton(el('gsi'), {
    theme: 'outline', size: 'large', width: 320, text: 'signin_with'
  });
  google.accounts.id.prompt();
};

function signIn(credential) {
  S.token = credential;
  api('session.bootstrap', {}).then(function (data) {
    S.session = data.session;
    S.reference = data.reference;
    el('boot').hidden = true;
    el('app').hidden = false;
    applyDeepLink();
    renderChrome();
    navigate(S.page);
  }).catch(function (err) {
    S.token = null;
    showSignIn(err.message);
  });
}

// The sign-in library may never load — it is not needed without a client ID —
// so the built-in path is started here rather than from its callback.
if (!String(window.APP_CLIENT_ID || '').trim()) {
  startWithBuiltInIdentity();
}

el('signOut').addEventListener('click', function () {
  S.token = null;
  S.session = null;
  if (window.google && google.accounts) google.accounts.id.disableAutoSelect();
  showSignIn(null);
});

function applyDeepLink() {
  const link = S.deepLink || {};
  if (link.page === 'claim' && link.id) { S.page = 'claims'; S.tab = 'all'; }
  else if (link.page === 'batch') { S.page = 'batch'; }
  else if (link.page === 'orders') { S.page = 'orders'; }
  else if (link.page === 'claims') { S.page = 'claims'; }
  if (S.session.role === ROLE.PRINCIPAL && S.page === 'claims') S.page = 'batch';
  if (S.session.role === ROLE.ADMIN) S.view = 'item';
}

/* ============================================================== chrome */

function renderChrome() {
  const s = S.session;
  el('whoText').textContent = s.name + ' · ' + s.role;
  el('whoAvatar').textContent = initials(s.name);

  const pages = [{ id: 'claims', label: 'Claims' }];
  if (s.role === ROLE.REQUESTER || s.role === ROLE.PRODUCTION) {
    pages.push({ id: 'new', label: 'New Claim' });
  }
  if (s.role === ROLE.PRINCIPAL) pages.unshift({ id: 'batch', label: 'Batches' });
  if (s.role === ROLE.ADMIN) {
    pages.push({ id: 'orders', label: 'Orders' });
    pages.push({ id: 'master', label: 'Master Data' });
    pages.push({ id: 'templates', label: 'Email Templates' });
    pages.push({ id: 'email', label: 'Email Log' });
    pages.push({ id: 'audit', label: 'Audit Log' });
  }

  el('nav').innerHTML = pages.map(function (p) {
    return '<button type="button" data-page="' + p.id + '"' +
      (S.page === p.id ? ' class="on"' : '') + '>' + h(p.label) + '</button>';
  }).join('');
  el('nav').querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () { navigate(b.dataset.page); });
  });

  renderTesterBar();
}

function renderTesterBar() {
  const host = el('testerBar');
  if (!S.session.isTester) { host.innerHTML = ''; return; }
  const roles = [ROLE.REQUESTER, ROLE.PRODUCTION, ROLE.ADMIN, ROLE.PRINCIPAL];
  host.innerHTML =
    '<div class="tester">' +
      '<span>🧪 TEST MODE</span>' +
      '<label>Viewing as ' +
        '<select id="simRole">' + roles.map(function (r) {
          return '<option value="' + r + '"' +
            (S.session.simulatedRole === r ? ' selected' : '') + '>' + r + '</option>';
        }).join('') + '</select>' +
      '</label>' +
      '<span class="tiny" style="color:inherit">Signed in as ' + h(S.session.email) +
        ' · actions are limited to test claims · notifications are redirected to you</span>' +
      '<span class="spacer"></span>' +
      '<button class="btn sm" id="purgeTest" type="button">Purge Test Claims</button>' +
    '</div>';

  el('simRole').addEventListener('change', function () {
    S.session.simulatedRole = this.value;
    S.session.role = this.value;
    S.view = this.value === ROLE.ADMIN ? 'item' : 'claim';
    S.page = this.value === ROLE.PRINCIPAL ? 'batch' : 'claims';
    renderChrome();
    navigate(S.page);
  });
  el('purgeTest').addEventListener('click', function () {
    if (!confirm('Permanently remove every test claim, its files and its log entries?')) return;
    api('test.purge', {}).then(function (r) {
      toast('Removed ' + r.claims + ' test claims and ' + r.folders + ' folders.', 'ok');
      navigate(S.page);
    }).catch(fail);
  });
}

function navigate(page) {
  S.page = page;
  renderChrome();
  if (page === 'new') { S.page = 'claims'; renderChrome(); openClaimForm(null); loadClaims(); return; }
  if (page === 'claims') return loadClaims();
  if (page === 'batch') return loadBatches();
  if (page === 'orders') return loadOrders();
  if (page === 'master') return loadMaster(S.master.kind);
  if (page === 'templates') return loadTemplates();
  if (page === 'email') return loadEmailLog();
  if (page === 'audit') return loadAudit();
}

function skeleton(rows) {
  const out = [];
  for (let i = 0; i < (rows || 5); i++) out.push('<div class="skel"></div>');
  return '<div style="display:flex;flex-direction:column;gap:8px">' + out.join('') + '</div>';
}

/* ============================================================== claims */

function loadClaims() {
  el('view').innerHTML = skeleton(6);
  const filter = Object.assign({ tab: S.tab }, S.filters);
  api('claims.list', filter).then(function (data) {
    S.rows = data.rows;
    S.counts = data.counts;
    renderClaims();
    const link = S.deepLink;
    if (link && link.page === 'claim' && link.id) {
      S.deepLink = {};
      openClaimPanel(link.id);
    }
  }).catch(function (e) { fail(e); el('view').innerHTML = '<div class="empty">' + h(e.message) + '</div>'; });
}

function renderClaims() {
  const s = S.session;
  const canCreate = s.role === ROLE.REQUESTER || s.role === ROLE.PRODUCTION;

  const html = [
    '<div class="tabs">',
    tabButton('action', 'Needs Action', S.counts.action),
    tabButton('progress', 'In Progress'),
    tabButton('completed', 'Completed'),
    tabButton('all', 'All'),
    '</div>',
    '<div class="toolbar">',
      '<div class="seg">',
        '<button type="button" data-view="claim"' + (S.view === 'claim' ? ' class="on"' : '') + '>By claim</button>',
        '<button type="button" data-view="item"' + (S.view === 'item' ? ' class="on"' : '') + '>By spare part</button>',
      '</div>',
      '<input type="text" id="q" class="grow" placeholder="Search claim ID, reference, serial number, customer…" value="' + h(S.filters.search) + '">',
      selectFilter('statusFilter', 'All statuses', S.reference.statuses, S.filters.statuses[0] || ''),
      selectFilter('warrantyFilter', 'All warranties', S.reference.warrantyTypes, S.filters.warrantyTypes[0] || ''),
      customerFilter(),
      principalFilter(),
      '<span class="spacer"></span>',
      s.role === ROLE.ADMIN ? '<button class="btn" id="digestNow" type="button">Send Digest Now</button>' : '',
      '<button class="btn" id="doExport" type="button">Export to Excel</button>',
      canCreate ? '<button class="btn pri" id="newClaim" type="button">New Claim</button>' : '',
    '</div>',
    activeChips(),
    S.rows.length
      ? (S.view === 'claim' ? claimTable() : itemTable())
      : '<div class="tablewrap"><div class="empty">Nothing here yet.</div></div>'
  ].join('');

  el('view').innerHTML = html;
  wireClaimsToolbar();
}

function tabButton(id, label, count) {
  return '<button type="button" data-tab="' + id + '"' + (S.tab === id ? ' class="on"' : '') + '>' +
    h(label) + (count ? ' <span class="count">' + count + '</span>' : '') + '</button>';
}

function selectFilter(id, blank, options, value) {
  return '<select id="' + id + '" style="width:auto;min-width:150px">' +
    '<option value="">' + h(blank) + '</option>' +
    options.map(function (o) {
      return '<option value="' + h(o) + '"' + (o === value ? ' selected' : '') + '>' + h(o) + '</option>';
    }).join('') + '</select>';
}

function customerFilter() {
  return '<select id="customerFilter" style="width:auto;max-width:220px">' +
    '<option value="">All customers</option>' +
    S.reference.customers.map(function (c) {
      return '<option value="' + h(c.id) + '"' +
        (S.filters.customerId === c.id ? ' selected' : '') + '>' + h(c.name) + '</option>';
    }).join('') + '</select>';
}

/** Only an administrator sees more than one principal, so only they can filter. */
function principalFilter() {
  if (S.session.role !== ROLE.ADMIN) return '';
  const names = S.reference.principals || [];
  if (names.length < 2) return '';
  return '<select id="principalFilter" style="width:auto;max-width:180px">' +
    '<option value="">All principals</option>' +
    names.map(function (n) {
      return '<option value="' + h(n) + '"' +
        (S.filters.principal === n ? ' selected' : '') + '>' + h(n) + '</option>';
    }).join('') + '</select>';
}

function activeChips() {
  const chips = [];
  if (S.filters.statuses.length) {
    chips.push(chip('Status', S.filters.statuses.join(', '), 'statuses'));
  }
  if (S.filters.warrantyTypes.length) {
    chips.push(chip('Warranty', S.filters.warrantyTypes.join(', '), 'warrantyTypes'));
  }
  if (S.filters.customerId) {
    const c = S.reference.customers.filter(function (x) { return x.id === S.filters.customerId; })[0];
    chips.push(chip('Customer', c ? c.name : S.filters.customerId, 'customerId'));
  }
  if (S.filters.principal) chips.push(chip('Principal', S.filters.principal, 'principal'));
  if (!chips.length) return '';
  return '<div class="toolbar">' + chips.join('') + '</div>';
}

function chip(label, value, key) {
  return '<span class="chip"><b>' + h(label) + '</b> ' + h(value) +
    '<button type="button" data-clear="' + key + '" aria-label="Remove filter">✕</button></span>';
}

function claimTable() {
  const s = S.session;
  const showCustomer = true;
  const showRequester = s.role === ROLE.ADMIN || s.role === ROLE.PRINCIPAL;
  const showWo = s.role === ROLE.ADMIN || s.role === ROLE.PRINCIPAL;

  const showPrincipal = s.role === ROLE.ADMIN;
  const head = ['<th class="caret"></th>', '<th>Claim</th>', '<th>Date</th>'];
  if (showPrincipal) head.push('<th>Principal</th>');
  if (showCustomer) head.push('<th>Customer</th>');
  head.push('<th>Serial number</th>', '<th>Parts</th>');
  if (showRequester) head.push('<th>Requested by</th>');
  if (showWo) head.push('<th>Work order</th>');
  head.push('<th>Status</th>', '<th>Age</th>');

  const body = S.rows.map(function (c) {
    const open = !!S.expanded[c.claimId];
    const cells = [
      '<td class="caret" data-toggle="' + h(c.claimId) + '">' + (open ? '▾' : '▸') + '</td>',
      '<td class="stack"><span class="mono">' + h(c.claimId) + '</span>' +
        '<span class="mono tiny">' + h(c.refNo || 'not submitted') + '</span></td>',
      '<td>' + h(fmtDate(c.submittedAt || c.createdAt)) + '</td>'
    ];
    if (showPrincipal) {
      cells.push('<td' + (c.principal ? '' : ' class="dimmer"') + '>' +
        h(c.principal || 'unattributed') + '</td>');
    }
    if (showCustomer) cells.push('<td>' + h(c.customerName) + '</td>');
    cells.push(
      '<td class="stack"><span class="mono">' + h(c.serialNumber) + '</span>' +
        warrantyPill(c.warrantyType) + '</td>',
      '<td>' + c.items.length + ' item' + (c.items.length === 1 ? '' : 's') + '</td>'
    );
    if (showRequester) cells.push('<td class="dim">' + h(c.requesterName) + '</td>');
    if (showWo) {
      cells.push('<td class="mono' + (c.workOrderNo ? '' : ' dimmer') + '">' +
        h(c.workOrderNo || '— required') + '</td>');
    }
    cells.push(
      '<td class="stack">' + statusPill(c.status) +
        (summaryText(c.summary) ? '<span class="tiny">' + h(summaryText(c.summary)) + '</span>' : '') +
        '</td>',
      '<td>' + ageCell(c.ageDays) + '</td>'
    );

    const rows = ['<tr class="click" data-claim="' + h(c.claimId) + '">' + cells.join('') + '</tr>'];
    if (open) {
      c.items.forEach(function (i) {
        rows.push('<tr class="sub"><td></td><td colspan="' + (head.length - 4) + '">' +
          h(i.partName) + '</td><td class="mono">' + i.qty + ' pcs</td><td>' +
          itemPill(i.itemStatus) + (i.decisionReason
            ? '<div class="tiny">' + h(i.decisionReason) + '</div>' : '') +
          '</td><td></td></tr>');
      });
    }
    return rows.join('');
  }).join('');

  return '<div class="tablewrap"><table class="data"><thead><tr>' + head.join('') +
    '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

function itemTable() {
  const s = S.session;
  const showWo = s.role === ROLE.ADMIN || s.role === ROLE.PRINCIPAL;
  const head = ['<th>Claim</th>', '<th>Serial number</th>', '<th>Customer</th>',
    '<th>Spare part</th>', '<th>Qty</th>'];
  if (showWo) head.push('<th>Work order</th>');
  head.push('<th>Status</th>', '<th>Reason</th>');

  const body = [];
  S.rows.forEach(function (c) {
    c.items.forEach(function (i, index) {
      const faded = index > 0 ? ' dimmer' : '';
      const cells = [
        '<td class="mono' + faded + '">' + h(c.claimId) + '</td>',
        '<td class="mono' + faded + '">' + h(c.serialNumber) + '</td>',
        '<td class="' + (index > 0 ? 'dimmer' : '') + '">' + h(c.customerName) + '</td>',
        '<td>' + h(i.partName) + '</td>',
        '<td class="mono">' + i.qty + '</td>'
      ];
      if (showWo) cells.push('<td class="mono' + faded + '">' + h(c.workOrderNo || '—') + '</td>');
      cells.push('<td class="stack">' + itemPill(i.itemStatus) +
        (i.advanceIssued ? '<span class="pill flat p-sub tiny">issued in advance</span>' : '') +
        '</td>',
        '<td class="tiny">' + h(i.decisionReason || '') + '</td>');
      body.push('<tr class="click" data-claim="' + h(c.claimId) + '">' + cells.join('') + '</tr>');
    });
  });

  return '<div class="tablewrap"><table class="data"><thead><tr>' + head.join('') +
    '</tr></thead><tbody>' + body.join('') + '</tbody></table></div>';
}

function wireClaimsToolbar() {
  el('view').querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { S.tab = b.dataset.tab; loadClaims(); });
  });
  el('view').querySelectorAll('[data-view]').forEach(function (b) {
    b.addEventListener('click', function () { S.view = b.dataset.view; renderClaims(); });
  });
  el('view').querySelectorAll('[data-toggle]').forEach(function (td) {
    td.addEventListener('click', function (e) {
      e.stopPropagation();
      const id = td.dataset.toggle;
      S.expanded[id] = !S.expanded[id];
      renderClaims();
    });
  });
  el('view').querySelectorAll('[data-claim]').forEach(function (tr) {
    tr.addEventListener('click', function () { openClaimPanel(tr.dataset.claim); });
  });
  el('view').querySelectorAll('[data-clear]').forEach(function (b) {
    b.addEventListener('click', function () {
      const key = b.dataset.clear;
      S.filters[key] = Array.isArray(S.filters[key]) ? [] : '';
      loadClaims();
    });
  });

  const q = el('q');
  if (q) {
    let timer = null;
    q.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { S.filters.search = q.value.trim(); loadClaims(); }, 350);
    });
  }
  const sf = el('statusFilter');
  if (sf) sf.addEventListener('change', function () {
    S.filters.statuses = this.value ? [this.value] : []; loadClaims();
  });
  const wf = el('warrantyFilter');
  if (wf) wf.addEventListener('change', function () {
    S.filters.warrantyTypes = this.value ? [this.value] : []; loadClaims();
  });
  const cf = el('customerFilter');
  if (cf) cf.addEventListener('change', function () {
    S.filters.customerId = this.value; loadClaims();

  const pf = el('principalFilter');

    S.filters.principal = this.value; loadClaims();

  const nc = el('newClaim');

/**
 * Every file a claim is meant to carry, attached or not.
 *
 * Listing only what was uploaded hid the more useful half: a claim with nothing
 * attached showed no section at all, which reads as "this screen does not show
 * files" rather than "there are no files". A claim cannot be submitted without
 * all of these, so the gaps are worth as much as the files.
 */
function evidenceSection(c) {
  const slots = [
    { kind: 'FAULT', label: 'Fault photo' },
    { kind: 'REPORT', label: 'Service report' }
  ].concat(c.items.map(function (i) {
    return { kind: 'PART', itemId: i.itemId, label: 'Photo — ' + i.partName };
  }));

  const taken = {};
  const rows = slots.map(function (slot) {
    const found = c.attachments.filter(function (a) {
      return a.kind === slot.kind && (slot.kind !== 'PART' || a.itemId === slot.itemId);
    })[0];
    if (found) taken[found.attachmentId] = true;
    return evidenceRow(slot.label, found);
  });

  // Anything that matches no slot — a photo whose part row was removed — is
  // still listed rather than quietly dropped.
  c.attachments.forEach(function (a) {
    if (!taken[a.attachmentId]) rows.push(evidenceRow(a.kind, a));
  });

  const missing = c.attachments.length === 0;
  return '<div class="panel-sec"><h3>Evidence</h3>' + rows.join('') +
    (missing
      ? '<div class="tiny">No file has been uploaded for this claim yet. ' +
        'Use Edit claim to attach them — all of them are required before it can be submitted.</div>'
      : '') +
    '</div>';
}

function evidenceRow(label, file) {
  if (!file) {
    return '<div class="itemrow" style="opacity:.75"><span class="nm">' + h(label) + '</span>' +
      '<span class="pill flat p-no">not attached</span></div>';
  }
  return '<div class="itemrow click" data-att="' + h(file.attachmentId) + '" ' +
    'style="cursor:pointer" title="Open ' + h(file.fileName) + '">' +
    '<span class="nm">' + h(label) + '</span>' +
    '<span class="tiny mono">' + h(file.fileName) + '</span>' +
    (Number(file.version) > 1 ? '<span class="pill flat p-draft">v' + h(file.version) + '</span>' : '') +
    '<span class="tiny">' + h(fileSize(file.sizeBytes)) + '</span>' +
    '</div>';
}

function fileSize(bytes) {
  const n = Number(bytes || 0);
  if (!n) return '';
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return Math.round(n / 1024) + ' KB';
  return (n / (1024 * 1024)).toFixed(1) + ' MB';
}

function kv(label, value) {
  return '<div class="row" style="gap:6px;font-size:12.5px"><span class="tiny" style="min-width:96px">' +
    h(label) + '</span><span>' + h(value) + '</span></div>';
}

function renderPanelActions(c) {
  const s = S.session;
  const host = el('panelActions');
  const buttons = [];

  const owner = String(c.requesterEmail).toLowerCase() === String(s.email).toLowerCase();
  const isRequester = s.role === ROLE.REQUESTER || s.role === ROLE.PRODUCTION;

  if (isRequester && owner && (c.status === STATUS.DRAFT || c.status === STATUS.RETURNED)) {
    buttons.push(btn('Edit claim', 'pri', function () { closePanel(); openClaimForm(c); }));
    if (c.status === STATUS.DRAFT) {
      buttons.push(btn('Delete draft', 'no', function () {
        if (!confirm('Remove this draft?')) return;
        api('claims.delete', { claimId: c.claimId, rowVersion: c.rowVersion })
          .then(function () { toast('Draft removed.', 'ok'); closePanel(); loadClaims(); })
          .catch(fail);
      }));
    }
  }

  if (s.role === ROLE.ADMIN) {
    if (c.status !== STATUS.CLOSED) {
      buttons.push(btn('Record advance issue', '', function () { promptAdvance(c); }));
    }
    if (!c.principal && c.status !== STATUS.CLOSED) {
      buttons.push(btn('Assign principal', 'pri', function () { promptPrincipal(c); }));
    }
    if (c.status === STATUS.SUBMITTED || c.status === STATUS.INTERNAL) {
      buttons.push(btn('Return to Requester', 'no', function () { promptReturn(c); }));
      buttons.push(btn('Override warranty', '', function () { promptOverride(c); }));
      buttons.push(btn('Amend', '', function () { closePanel(); openClaimForm(c); }));
    }
    if (c.status === STATUS.SUBMITTED) {
      if (c.warrantyType === WARRANTY.PRINCIPAL) {
        buttons.push(btn('Forward to Principal', 'pri', function () { promptForward(c); }));
      } else {
        buttons.push(btn('Process Internal Warranty', 'pri', function () {
          api('claims.internal', { claimId: c.claimId, rowVersion: c.rowVersion })
            .then(function () { toast('Moved to internal verification.', 'ok'); reopen(c.claimId); })
            .catch(fail);
        }));
      }
    }
    if (c.status === STATUS.INTERNAL) {
      buttons.push(btn('Approve parts', 'ok', function () { promptDecision(c, 'approve'); }));
      buttons.push(btn('Reject parts', 'no', function () { promptDecision(c, 'reject'); }));
    }
    if (c.status === STATUS.IN_REVIEW) {
      buttons.push(btn('Withdraw from Principal', '', function () {
        if (!confirm('Withdraw this claim from the principal?')) return;
        api('claims.withdraw', { claimId: c.claimId, rowVersion: c.rowVersion })
          .then(function () { toast('Withdrawn.', 'ok'); reopen(c.claimId); }).catch(fail);
      }));
    }
    if (c.status === STATUS.FULFILMENT) {
      buttons.push(btn('Open in Orders', 'pri', function () { closePanel(); navigate('orders'); }));
    }
  }

  if (s.role === ROLE.PRINCIPAL && c.warrantyType === WARRANTY.PRINCIPAL &&
    [STATUS.IN_REVIEW, STATUS.FULFILMENT, STATUS.CLOSED].indexOf(c.status) !== -1) {
    buttons.push(btn('Approve parts', 'ok', function () { promptDecision(c, 'approve'); }));
    buttons.push(btn('Reject parts', 'no', function () { promptDecision(c, 'reject'); }));
  }

  if (!buttons.length) {
    host.innerHTML = '<span class="tiny">No action is available to you at this status.</span>';
    return;
  }
  host.innerHTML = '';
  buttons.forEach(function (b) { host.appendChild(b); });
}

function btn(label, cls, onClick) {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'btn ' + (cls || '');
  b.textContent = label;
  b.addEventListener('click', onClick);
  return b;
}

function reopen(claimId) { openClaimPanel(claimId); loadClaims(); }

/**
 * Opens one attachment.
 *
 * A photo comes back as a data URI built from the file itself, which takes a
 * few seconds. Without something on screen the click looked like it had done
 * nothing, so the box opens straight away and fills in when the file arrives.
 */
function showAttachment(attachmentId) {
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = '<div class="loading"><span class="spinner"></span>Opening…</div>';
  box.addEventListener('click', function () { box.remove(); });
  document.body.appendChild(box);

  api('claims.attachment', { attachmentId: attachmentId }).then(function (a) {
    if (!box.isConnected) return;   // closed while it was loading
    if (a.kind === 'pdf') { box.remove(); window.open(a.url, '_blank'); return; }
    const img = new Image();
    img.alt = a.name;
    img.onload = function () {
      if (!box.isConnected) return;
      box.innerHTML = '';
      box.appendChild(img);
    };
    img.onerror = function () {
      box.innerHTML = '<div class="loading">' + h(a.name) + ' could not be shown.</div>';
    };
    img.src = a.dataUri;
  }).catch(function (e) {
    box.remove();
    fail(e);
  });
}

/**
 * Records that a part was handed over from stock before the decision came back.
 * The claim is untouched by this — it simply says where the part physically is,
 * which changes what the eventual delivery means and who carries the cost if the
 * claim is refused.
 */
function promptAdvance(claim) {
  const eligible = claim.items.filter(function (i) { return i.itemStatus !== ITEM.SHIPPED; });
  if (!eligible.length) { toast('Every part on this claim has already been delivered.', 'err'); return; }

  openModal({
    title: 'Record advance issue',
    size: 'narrow',
    body: '<p class="tiny">Tick the parts that were supplied from local stock so the machine could ' +
      'be put back in service. The claim carries on as normal; what the principal eventually sends ' +
      'replenishes stock instead of travelling to site.</p>' +
      '<div class="blk"><h3>Spare parts</h3>' +
      eligible.map(function (i) {
        return '<label class="itemrow"><input type="checkbox" class="pick" value="' + h(i.itemId) +
          '"' + (i.advanceIssued ? ' checked' : '') + '><span class="nm">' + h(i.partName) +
          '</span><span class="mono tiny">' + i.qty + ' pcs</span>' + itemPill(i.itemStatus) +
          '</label>';
      }).join('') + '</div>' +
      '<label class="field"><span>Note</span>' +
      '<input type="text" id="advNote" placeholder="When it was handed over, and by whom"></label>',
    actions: [
      { label: 'Cancel', close: true },
      { label: 'Clear the flag', onClick: function (close) {
        const ids = claim.items.filter(function (i) { return i.advanceIssued; })
          .map(function (i) { return i.itemId; });
        if (!ids.length) { toast('No part is flagged.', 'err'); return; }
        api('claims.advanceIssue', { itemIds: ids, issued: false })
          .then(function () { close(); toast('Flag cleared.', 'ok'); reopen(claim.claimId); })
          .catch(fail);
      } },
      { label: 'Record', primary: true, onClick: function (close) {
        const ids = Array.prototype.slice.call(document.querySelectorAll('.pick:checked'))
          .map(function (n) { return n.value; });
        if (!ids.length) { toast('Select at least one spare part.', 'err'); return; }
        api('claims.advanceIssue', {
          itemIds: ids, issued: true, note: el('advNote').value.trim()
        }).then(function () { close(); toast('Recorded.', 'ok'); reopen(claim.claimId); })
          .catch(fail);
      } }
    ]
  });
}

/** Attributes a claim whose unit the population sheet cannot place. */

function promptForward(c) {

      '<input type="text" id="wo" value="' + h(c.workOrderNo || '') + '" placeholder="WO-2608-0041"></label>' +

      { label: 'Cancel', close: true },
      { label: 'Forward', primary: true, onClick: function (close) {

        if (!wo) { toast('Enter the work order number first.', 'err'); return; }

          .then(function () { close(); toast('Forwarded to principal.', 'ok'); reopen(c.claimId); })
          .catch(fail);
      } }

function promptDecision(claim, decision) {
  const open = claim.items.filter(function (i) {
    return [ITEM.FORWARDED, ITEM.AWAITING, ITEM.SHIPPED].indexOf(i.itemStatus) === -1;
  });
  if (!open.length) { toast('Every part on this claim has already been ordered.', 'err'); return; }

  openModal({
    title: decision === 'approve' ? 'Approve spare parts' : 'Reject spare parts',
    size: 'narrow',
    body: '<div class="blk"><h3>Spare parts</h3>' +
      open.map(function (i) {
        return '<label class="itemrow"><input type="checkbox" class="pick" value="' + h(i.itemId) +
          '" checked><span class="nm">' + h(i.partName) + '</span>' +
          '<span class="mono tiny">' + i.qty + ' pcs</span>' + itemPill(i.itemStatus) + '</label>';
      }).join('') + '</div>' +
      '<label class="field"><span>Reason' +
        (decision === 'reject' ? ' <b class="req">*</b>' : '') + '</span>' +
      '<textarea id="reason" placeholder="' +
        (decision === 'reject' ? 'Why is this not covered?' : 'Optional note') + '"></textarea></label>',
    actions: [
      { label: 'Cancel', close: true },
      { label: decision === 'approve' ? 'Approve' : 'Reject',
        primary: decision === 'approve', danger: decision === 'reject',
        onClick: function (close) {
          const ids = Array.prototype.slice.call(document.querySelectorAll('.pick:checked'))
            .map(function (n) { return n.value; });
          if (!ids.length) { toast('Select at least one spare part.', 'err'); return; }
          const reason = el('reason').value.trim();
          if (decision === 'reject' && !reason) { toast('A rejection must state its reason.', 'err'); return; }
          api('claims.decide', { itemIds: ids, decision: decision, reason: reason })
            .then(function () { close(); toast('Decision recorded.', 'ok'); reopen(claim.claimId); })
            .catch(fail);
        } }
    ]
  });
}

/* ============================================================== modals */

function openModal(spec) {
  const actions = (spec.actions || []).map(function (a, i) {
    return '<button type="button" class="btn ' +
      (a.primary ? 'pri' : a.danger ? 'no' : '') + '" data-action="' + i + '">' + h(a.label) + '</button>';
  }).join('');

  el('modalHost').innerHTML =
    '<div class="modal-scrim"><div class="modal ' + (spec.size === 'wide' ? 'wide' :
      spec.size === 'narrow' ? 'narrow' : '') + '">' +
      '<div class="modal-head"><h2>' + h(spec.title) + '</h2>' +
        (spec.meta ? '<span class="mono tiny">' + h(spec.meta) + '</span>' : '') + '</div>' +
      '<div class="modal-body">' + spec.body + '</div>' +
      '<div class="modal-foot">' + (spec.footNote ? '<span class="tiny">' + h(spec.footNote) +
        '</span>' : '') + '<span class="spacer"></span>' + actions + '</div>' +
    '</div></div>';

  el('modalHost').querySelectorAll('[data-action]').forEach(function (b) {
    const spec_ = spec.actions[Number(b.dataset.action)];
    b.addEventListener('click', function () {
      if (spec_.close) { closeModal(); return; }
      spec_.onClick(closeModal);
    });
  });
  if (spec.onOpen) spec.onOpen();
}

function closeModal() { el('modalHost').innerHTML = ''; }

/* ============================================================ combobox */

/**
 * A searchable dropdown.
 *
 * The customer list runs to 1,386 names and the unit register to a few thousand
 * serial numbers. At that size a <select> is something you scroll rather than
 * something you use, so both fields are typed into and filtered as you type.
 * What is typed is never thrown away silently: when it matches nothing, the
 * list says so and names the administrator to ask.
 *
 * spec: {
 *   id          the hidden input the form reads; the visible box is <id>Text
 *   options     [{ value, label, hint }]
 *   value, text what the field carries and shows on first render
 *   allowFree   keep text that is on no list (the serial number field)
 *   mono, placeholder
 *   emptyHtml(query)  what the list shows when nothing matches
 *   onPick(value)     after a choice from the list
 *   onType(value)     after free text, when allowFree
 * }
 */
const COMBO = {};
const COMBO_SHOWN = 40;

function comboField(spec) {
  COMBO[spec.id] = spec;
  return '<div class="combo" data-combo="' + h(spec.id) + '">' +
    '<input type="text" id="' + h(spec.id) + 'Text" class="combo-box' + (spec.mono ? ' mono' : '') +
      '" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="' +
      h(spec.id) + 'List" autocomplete="off" spellcheck="false" placeholder="' +
      h(spec.placeholder || 'Type to search…') + '" value="' + h(spec.text || '') + '">' +
    '<input type="hidden" id="' + h(spec.id) + '" value="' + h(spec.value || '') + '">' +
    '<div class="combo-pop" id="' + h(spec.id) + 'List" role="listbox" hidden></div>' +
    '</div>';
}

function wireCombo(id) {
  const spec = COMBO[id];
  const box = el(id + 'Text');
  const value = el(id);
  const pop = el(id + 'List');
  if (!spec || !box || !value || !pop) return;

  spec.shown = [];
  spec.active = -1;
  // Until something is typed the whole list is offered, even when the box
  // already holds a choice: a field you cannot reopen to change your mind is
  // worse than no dropdown at all.
  spec.typed = false;

  function labelFor(v) {
    const hit = (spec.options || []).filter(function (o) { return o.value === v; })[0];
    return hit ? hit.label : '';
  }

  function show() {
    const opening = pop.hidden;
    pop.hidden = false;
    box.setAttribute('aria-expanded', 'true');
    // A row near the bottom of the modal would otherwise open its list into the
    // part of the scrolling body nobody can see.
    if (opening && pop.scrollIntoView) pop.scrollIntoView({ block: 'nearest' });
  }
  function hide() { pop.hidden = true; box.setAttribute('aria-expanded', 'false'); spec.active = -1; }

  function render(open) {
    const query = spec.typed ? box.value.trim() : '';
    const q = query.toLowerCase();
    const all = spec.options || [];
    const shown = [];
    let total = 0;
    for (let i = 0; i < all.length; i++) {
      const o = all[i];
      if (q && o.label.toLowerCase().indexOf(q) === -1 &&
        !(o.hint && o.hint.toLowerCase().indexOf(q) !== -1)) continue;
      total += 1;
      if (shown.length < COMBO_SHOWN) shown.push(o);
    }
    spec.shown = shown;
    if (spec.active >= shown.length) spec.active = shown.length - 1;

    pop.innerHTML = shown.length
      ? shown.map(function (o, i) {
          return '<div class="combo-opt' + (i === spec.active ? ' on' : '') + '" role="option"' +
            ' aria-selected="' + (i === spec.active) + '" data-i="' + i + '">' +
            '<span class="combo-l' + (spec.mono ? ' mono' : '') + '">' + h(o.label) + '</span>' +
            (o.hint ? '<span class="combo-h">' + h(o.hint) + '</span>' : '') + '</div>';
        }).join('') +
        (total > shown.length
          ? '<div class="combo-more">' + (total - shown.length) +
            ' more — keep typing to narrow the list</div>'
          : '')
      : '<div class="combo-none">' +
        (spec.emptyHtml ? spec.emptyHtml(box.value.trim()) : 'Nothing matches.') + '</div>';

    if (open) show();
  }

  function pick(option) {
    if (!option) return;
    box.value = option.label;
    value.value = option.value;
    spec.typed = false;
    hide();
    if (spec.onPick) spec.onPick(option.value, option);
  }

  box.addEventListener('focus', function () { spec.typed = false; render(true); });

  box.addEventListener('input', function () {
    spec.active = -1;
    spec.typed = true;
    if (spec.allowFree) {
      value.value = box.value.trim();
      if (spec.onType) spec.onType(value.value);
    }
    render(true);
  });

  box.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (pop.hidden) render(true);
      if (!spec.shown.length) return;
      spec.active = e.key === 'ArrowDown'
        ? (spec.active + 1) % spec.shown.length
        : (spec.active <= 0 ? spec.shown.length - 1 : spec.active - 1);
      render(true);
      const on = pop.querySelector('.combo-opt.on');
      if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
      return;
    }
    if (e.key === 'Enter') {
      if (!pop.hidden && spec.active >= 0) { e.preventDefault(); pick(spec.shown[spec.active]); }
      else hide();
      return;
    }
    if (e.key === 'Escape') hide();
  });

  // mousedown rather than click, with the default prevented: the field keeps
  // focus, so choosing with the mouse never races the blur handler below.
  pop.addEventListener('mousedown', function (e) {
    const option = e.target.closest ? e.target.closest('.combo-opt') : null;
    if (!option) return;
    e.preventDefault();
    pick(spec.shown[Number(option.dataset.i)]);
  });

  box.addEventListener('blur', function () {
    hide();
    spec.typed = false;
    if (spec.allowFree) {
      value.value = box.value.trim();
      if (spec.onType) spec.onType(value.value);
      return;
    }
    // A list-only field holds only what is on the list: half a customer name is
    // not a customer, and leaving it in the box would look like a choice.
    const typed = box.value.trim().toLowerCase();
    const exact = (spec.options || []).filter(function (o) {
      return o.label.toLowerCase() === typed;
    })[0];
    if (exact) { value.value = exact.value; box.value = exact.label; return; }
    box.value = labelFor(value.value);
  });

  spec.render = render;
  render(false);
}

/** Swaps a combobox's list in once it has arrived, redrawing it if it is open. */
function comboSetOptions(id, options) {
  const spec = COMBO[id];
  const pop = el(id + 'List');
  if (!spec) return;
  spec.options = options;
  if (spec.render) spec.render(pop ? !pop.hidden : false);
}

/* ------------------------------------------------------- unit register */

let unitsRequest = null;

/**
 * The registered units, fetched once and kept for the session. They are not
 * part of the sign-in payload because only the claim form needs them.
 */
function loadUnits() {
  if (S.units) return Promise.resolve(S.units);
  if (!unitsRequest) {
    unitsRequest = api('claims.units').then(function (data) {
      S.units = (data && data.units) || [];
      return S.units;
    }).catch(function (err) { unitsRequest = null; throw err; });
  }
  return unitsRequest;
}

function unitOptions() {
  return (S.units || []).map(function (u) {
    return { value: u.serial, label: u.serial, hint: u.product || '' };
  });
}

/** Who to ask when a customer or a unit is not on the list. */
function adminContactText() {
  const admins = (S.reference && S.reference.administrators) || [];
  if (!admins.length) return 'Please contact the portal administrator.';
  return 'Please contact the administrator: ' + admins.map(function (a) {
    return a.name + ' (' + a.email + ')';
  }).join(', ') + '.';
}

function adminContactHtml() {
  const admins = (S.reference && S.reference.administrators) || [];
  if (!admins.length) return 'Please contact the portal administrator.';
  return 'Please contact the administrator: ' + admins.map(function (a) {
    return h(a.name) + ' <a href="mailto:' + h(a.email) + '" target="_blank">' +
      h(a.email) + '</a>';
  }).join(', ') + '.';
}

/* ========================================================== claim form */

const FORM = { claim: null, items: [], files: {}, lookup: null };

function openClaimForm(existing) {
  FORM.claim = existing || null;
  FORM.items = existing
    ? existing.items.map(function (i) {
        return {
          itemId: i.itemId, partId: i.partId, partName: i.partName, qty: i.qty, file: null,
          hasPhoto: (existing.attachments || []).some(function (a) {
            return a.kind === 'PART' && a.itemId === i.itemId;
          })
        };
      })
    : [{ itemId: null, partId: '', partName: '', qty: 1, file: null, hasPhoto: false }];
  FORM.files = {
    FAULT: { file: null, has: existing ? (existing.attachments || []).some(function (a) { return a.kind === 'FAULT'; }) : false },
    REPORT: { file: null, has: existing ? (existing.attachments || []).some(function (a) { return a.kind === 'REPORT'; }) : false }
  };
  FORM.lookup = null;

  openModal({
    title: existing ? (S.session.role === ROLE.ADMIN ? 'Amend Claim' : 'Edit Claim') : 'New Warranty Claim',
    meta: existing ? existing.claimId : '',
    body: '<div id="formBody">' + claimFormBody() + '</div>',
    actions: [
      { label: 'Cancel', close: true },
      { label: 'Save Draft', onClick: function () { saveForm(false); } },
      { label: existing && S.session.role === ROLE.ADMIN ? 'Save changes' : 'Submit Claim',
        primary: true, onClick: function () { saveForm(true); } }
    ],
    onOpen: function () {
      wireClaimForm();
      if (existing && existing.serialNumber) runLookup(existing.serialNumber);
    }
  });
}

function claimFormBody() {
  const c = FORM.claim;
  const isProduction = S.session.role === ROLE.PRODUCTION;
  const isAdmin = S.session.role === ROLE.ADMIN;

  return [
    '<div class="blk"><h3>Submission</h3><div class="grid2">',
      '<div class="ro">' + h(S.session.name) + '</div>',
      '<div class="ro">' + h(fmtDate(new Date().toISOString())) + '</div>',
      '<div class="ro mono">' + h(c && c.refNo ? c.refNo : 'assigned on submit') + '</div>',
      '<div class="ro mono">' + h(c ? c.claimId : 'assigned on save') + '</div>',
    '</div><p class="tiny">Claims submitted on the same day share one reference number so the ' +
      'principal receives them as a single batch.</p></div>',

    '<div class="blk"><h3>Unit</h3><div class="grid2">',
      '<label class="field"><span>Customer <b class="req">*</b></span>' +
        (isProduction
          ? '<div class="ro">' + h(S.reference.productionCustomer) + '</div>'
          : comboField({
            id: 'fCustomer',
            value: c ? c.customerId : '',
            text: c ? c.customerName : '',
            placeholder: 'Type to search customers…',
            options: S.reference.customers.map(function (x) {
              return { value: x.id, label: x.name };
            }),
            emptyHtml: function (query) {
              return 'No customer matches “' + h(query) + '”. ' + adminContactHtml();
            }
          })) +
      '</label>',
      '<label class="field"><span>Serial number <b class="req">*</b></span>' +
        comboField({
          id: 'fSerial',
          allowFree: true,
          mono: true,
          value: c ? c.serialNumber : '',
          text: c ? c.serialNumber : '',
          placeholder: 'XT2410090',
          options: unitOptions(),
          emptyHtml: function (query) {
            return !S.units
              ? 'Still loading the unit list…'
              : 'No unit matches “' + h(query) + '” in the Population sheet. You can still ' +
                'claim on it, but nothing will say which principal it belongs to. ' +
                adminContactHtml();
          },
          onType: function (v) { scheduleLookup(v); },
          onPick: function (v) { runLookup(v); }
        }) +
        // A div, not a span: label.field styles its own spans as the field's
        // caption, which would shout this quiet hint back in capitals.
        '<div class="tiny" id="serialHint"></div>' +
      '</label>',
    '</div><div id="lookupBox"></div>',
    isAdmin && c ? '<label class="field"><span>Reason for change</span>' +
      '<input type="text" id="fReason" placeholder="Required when the serial number changes"></label>' : '',
    '</div>',

    '<div class="blk"><h3>Fault</h3>',
      '<label class="field"><span>Problem description <b class="req">*</b></span>' +
        '<textarea id="fProblem" placeholder="Describe what the machine is doing">' +
        h(c ? c.problem : '') + '</textarea></label>',
    '</div>',

    '<div class="blk"><h3>Spare parts requested <b class="req">*</b></h3>',
      '<div id="partRows">' + partRows() + '</div>',
      '<button type="button" class="addrow" id="addPart">+ Add spare part</button>',
    '</div>',

    '<div class="blk"><h3>Attachments</h3><div class="grid2">',
      fileField('FAULT', 'Fault photo', 'image/*'),
      fileField('REPORT', 'Service report', 'application/pdf,image/*'),
    '</div></div>'
  ].join('');
}

/** The master name behind a part id, for a row that only kept the id. */
function partName(partId) {
  const hit = (S.reference.parts || []).filter(function (p) { return p.id === partId; })[0];
  return hit ? hit.name : '';
}

function partRows() {
  return FORM.items.map(function (item, index) {
    const missing = !item.hasPhoto && !item.file;
    const warn = FORM.lookup && FORM.lookup.openParts && FORM.lookup.openParts[item.partId];
    return '<div class="partrow' + (missing ? ' bad' : '') + '" data-index="' + index + '">' +
      '<span class="idx">' + (index + 1) + '</span>' +
      comboField({
        id: 'pPart' + index,
        value: item.partId,
        text: item.partName || partName(item.partId),
        placeholder: 'Type to search spare parts…',
        options: S.reference.parts.map(function (p) {
          return { value: p.id, label: p.name };
        }),
        emptyHtml: function (query) {
          return 'No spare part matches “' + h(query) + '”. ' + adminContactHtml();
        },
        onPick: function (value, option) {
          FORM.items[index].partId = value;
          FORM.items[index].partName = option.label;
          refreshPartRows();
        }
      }) +
      '<input type="number" class="pQty qty" min="1" value="' + (item.qty || 1) + '">' +
      '<label class="filebtn' + (missing ? '' : ' has') + ' file">' +
        (item.file ? '✓ ' + h(item.file.name) : item.hasPhoto ? '✓ photo attached' : 'Choose photo…') +
        '<input type="file" class="pFile" accept="image/*"></label>' +
      '<button type="button" class="btn sm ghost pDel" aria-label="Remove row">✕</button>' +
      (warn ? '<div class="notice crit" style="grid-column:1/-1">⚠ This part is already requested on ' +
        '<span class="mono">' + h(warn.claimId) + '</span> (' + h(warn.status) + ') and not yet resolved.' +
        '</div>' : '') +
    '</div>';
  }).join('');
}

function fileField(kind, label, accept) {
  const f = FORM.files[kind];
  const ok = f.has || f.file;
  return '<label class="field"><span>' + h(label) + ' <b class="req">*</b></span>' +
    '<label class="filebtn' + (ok ? ' has' : '') + '" style="padding:7px 10px">' +
      (f.file ? '✓ ' + h(f.file.name) : f.has ? '✓ attached' : 'Choose file…') +
      '<input type="file" class="kindFile" data-kind="' + kind + '" accept="' + accept + '"></label>' +
    '</label>';
}

function wireClaimForm() {
  wireCombo('fCustomer');
  wireCombo('fSerial');
  setSerialHint();
  loadUnits().then(function () {
    comboSetOptions('fSerial', unitOptions());
    setSerialHint();
  }).catch(function () {
    setSerialHint('The unit list could not be loaded — type the serial number in full.');
  });

  const add = el('addPart');
  if (add) add.addEventListener('click', function () {
    FORM.items.push({ itemId: null, partId: '', partName: '', qty: 1, file: null,
      hasPhoto: false });
    refreshPartRows();
  });
  wirePartRows();
  document.querySelectorAll('.kindFile').forEach(function (input) {
    input.addEventListener('change', function () {
      const kind = input.dataset.kind;
      FORM.files[kind].file = input.files[0] || null;
      refreshAttachments();
    });
  });
}

function wirePartRows() {
  document.querySelectorAll('.partrow').forEach(function (row) {
    const index = Number(row.dataset.index);
    wireCombo('pPart' + index);
    row.querySelector('.pQty').addEventListener('change', function () {
      FORM.items[index].qty = Math.max(1, Number(this.value) || 1);
    });
    row.querySelector('.pFile').addEventListener('change', function () {
      FORM.items[index].file = this.files[0] || null;
      refreshPartRows();
    });
    row.querySelector('.pDel').addEventListener('click', function () {
      if (FORM.items.length === 1) { toast('A claim needs at least one spare part.', 'err'); return; }
      FORM.items.splice(index, 1);
      refreshPartRows();
    });
  });
}

function refreshPartRows() {
  const host = el('partRows');
  if (!host) return;
  host.innerHTML = partRows();
  wirePartRows();
}

function refreshAttachments() {
  const body = el('formBody');
  if (!body) return;
  const blocks = body.querySelectorAll('.blk');
  const last = blocks[blocks.length - 1];
  last.innerHTML = '<h3>Attachments</h3><div class="grid2">' +
    fileField('FAULT', 'Fault photo', 'image/*') +
    fileField('REPORT', 'Service report', 'application/pdf,image/*') + '</div>';
  last.querySelectorAll('.kindFile').forEach(function (input) {
    input.addEventListener('change', function () {
      FORM.files[input.dataset.kind].file = input.files[0] || null;
      refreshAttachments();
    });
  });
}

function setSerialHint(message) {
  const node = el('serialHint');
  if (!node) return;
  node.textContent = message !== undefined ? message
    : S.units
      ? S.units.length.toLocaleString() + ' registered units — type a serial number to search'
      : 'Loading the unit list…';
}

let lookupTimer = null;

function scheduleLookup(serial) {
  clearTimeout(lookupTimer);
  lookupTimer = setTimeout(function () { runLookup(serial); }, 400);
}

function runLookup(serial) {
  clearTimeout(lookupTimer);
  const box = el('lookupBox');
  if (!box) return;
  if (!serial) { box.innerHTML = ''; FORM.lookup = null; return; }
  box.innerHTML = '<div class="lookup none"><div class="l1">' + h(serial) + '</div>' +
    '<div class="tiny">Checking…</div></div>';

  api('claims.lookup', { serialNumber: serial }).then(function (data) {
    FORM.lookup = data;
    const w = data.warranty;
    const cls = w.type === WARRANTY.PRINCIPAL ? 'ok'
      : w.type === WARRANTY.OUT ? 'out'
        : w.type === WARRANTY.MANUAL ? 'manual' : 'none';
    const verdict = w.type === WARRANTY.PRINCIPAL
      ? 'PRINCIPAL WARRANTY — valid until ' + monthLabel(w.expiry) +
        (w.daysRemaining !== null ? ' <span class="tiny">(' + w.daysRemaining + ' days remaining)</span>' : '')
      : w.type === WARRANTY.OUT
        ? 'OUT OF PRINCIPAL WARRANTY — expired ' + monthLabel(w.expiry)
        : 'MANUAL VERIFICATION REQUIRED — the administrator will check this';

    box.innerHTML =
      '<div class="lookup ' + cls + '">' +
        '<div class="l1">' + h(data.serial) + '</div>' +
        (data.productName ? '<div>' + h(data.productName) + '</div>' : '') +
        '<div class="tiny" style="color:inherit">Principal: ' +
          (data.principal ? h(data.principal) : 'not attributed — the administrator will assign one') +
          '</div>' +
        '<div class="tiny" style="color:inherit">' + h(w.basis) + '</div>' +
        '<div class="l3">' + verdict + '</div>' +
      '</div>' +
      (data.registered === false
        ? '<div class="notice" style="margin-top:8px">⚠ <b class="mono">' + h(data.serial) +
          '</b> is not in the unit list the Population sheet supplies, so this claim cannot be ' +
          'attributed to a principal on its own — an administrator will have to assign one, or ' +
          'register the unit. Worth checking the serial number against the machine first. ' +
          adminContactHtml() + '</div>'
        : '') +
      (data.openClaims.length
        ? '<div class="notice" style="margin-top:8px">⚠ This unit has ' + data.openClaims.length +
          ' open claim' + (data.openClaims.length === 1 ? '' : 's') + ': ' +
          data.openClaims.map(function (o) {
            return '<span class="mono">' + h(o.claimId) + '</span> · ' + h(o.status);
          }).join(', ') + '</div>'
        : '');
    refreshPartRows();
  }).catch(function () {
    box.innerHTML = '<div class="lookup none"><div class="tiny">Could not check this serial number.</div></div>';
  });
}

function monthLabel(key) {
  if (!key) return '—';
  const parts = String(key).split('-');
  const names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return names[Number(parts[1]) - 1] + ' ' + parts[0];
}

/* ------------------------------------------------------ save & submit */

/**
 * What this claim still needs before it can be submitted, in the server's own
 * terms.
 *
 * submitClaim_ refuses an incomplete claim, and it is right to: a principal
 * cannot judge a fault they cannot see. But it refuses at the end, after the
 * claim has been saved and its files uploaded — so the claim exists, sits at
 * Draft, and the only word about why is a toast behind a panel. Asking first
 * costs nothing and says exactly what is missing.
 */
function missingForSubmit() {
  const missing = [];
  if (!el('fProblem').value.trim()) missing.push('a problem description');
  if (!FORM.files.FAULT.has && !FORM.files.FAULT.file) missing.push('a fault photo');
  if (!FORM.files.REPORT.has && !FORM.files.REPORT.file) missing.push('a service report');
  FORM.items.forEach(function (item, index) {
    if (item.hasPhoto || item.file) return;
    missing.push('a photo for ' + (item.partName || 'spare part ' + (index + 1)));
  });
  return missing;
}

/** An error the form itself carries, where the fields are, rather than a toast. */
function showFormProblem(message) {
  const body = el('formBody');
  if (!body) { toast(message, 'err'); return; }
  let box = el('formProblem');
  if (!box) {
    box = document.createElement('div');
    box.id = 'formProblem';
    box.className = 'notice crit';
    body.insertBefore(box, body.firstChild);
  }
  box.innerHTML = message;
  box.scrollIntoView({ block: 'nearest' });
}

function clearFormProblem() {
  const box = el('formProblem');
  if (box) box.remove();
}

function saveForm(thenSubmit) {
  const customerId = el('fCustomer') ? el('fCustomer').value : '';
  const serial = el('fSerial').value.trim();
  const problem = el('fProblem').value.trim();
  const reason = el('fReason') ? el('fReason').value.trim() : '';

  if (S.session.role !== ROLE.PRODUCTION && !customerId) {
    const typed = el('fCustomerText') ? el('fCustomerText').value.trim() : '';
    toast(typed
      ? '“' + typed + '” is not on the customer list. ' + adminContactText()
      : 'Choose a customer.', 'err');
    return;
  }
  if (!serial) { toast('Enter the serial number.', 'err'); return; }
  if (FORM.items.some(function (i) { return !i.partId; })) {
    toast('Choose a spare part for every row.', 'err'); return;
  }

  // The administrator's "Save changes" carries thenSubmit as well, and amends
  // rather than submits — only a real submission has to be complete.
  const submitting = thenSubmit && !(FORM.claim && S.session.role === ROLE.ADMIN);
  if (submitting) {
    const missing = missingForSubmit();
    if (missing.length) {
      showFormProblem('This claim cannot be submitted yet — it still needs ' +
        missing.map(function (m) { return h(m); }).join(', ') +
        '. <b>Save Draft</b> keeps everything you have entered, and you can add the rest later.');
      toast('Still missing ' + missing.length + ' thing' + (missing.length === 1 ? '' : 's') +
        ' — see the top of the form.', 'err');
      return;
    }
  }
  clearFormProblem();

  const steps = buildSteps(thenSubmit);
  showStepper(steps);

  const payload = {
    claimId: FORM.claim ? FORM.claim.claimId : null,
    rowVersion: FORM.claim ? FORM.claim.rowVersion : null,
    customerId: customerId,
    serialNumber: serial,
    problem: problem,
    reason: reason,
    items: FORM.items.map(function (i) {
      return { itemId: i.itemId, partId: i.partId, qty: i.qty };
    })
  };

  let claim = null;
  advanceStep(0);

  api('claims.save', payload)
    .then(function (saved) {
      claim = saved;
      completeStep(0);
      return uploadAll(saved, 1);
    })
    .then(function (nextStep) {
      if (!thenSubmit) return { claim: claim, step: nextStep };
      advanceStep(nextStep);
      return api('claims.submit', { claimId: claim.claimId, rowVersion: claim.rowVersion })
        .then(function (submitted) {
          completeStep(nextStep);
          advanceStep(nextStep + 1);
          completeStep(nextStep + 1);
          return { claim: submitted, step: nextStep + 1 };
        });
    })
    .then(function (result) {
      closeModal();
      toast(thenSubmit
        ? result.claim.claimId + ' submitted.'
        : 'Draft saved as ' + result.claim.claimId + '.', 'ok');
      reportUploadFailures();
      if (thenSubmit) showSubmitted(result.claim);
      loadClaims();
    })
    .catch(function (e) {
      if (e.kind === 'stale') { showConflict(e); return; }
      closeModal();
      fail(e);
      reportUploadFailures();
      if (claim) openClaimPanel(claim.claimId);
      loadClaims();
    });
}

function buildSteps(thenSubmit) {
  const steps = ['Saving the claim'];
  const partFiles = FORM.items.filter(function (i) { return i.file; });
  partFiles.forEach(function (i, n) {
    steps.push('Uploading part photo ' + (n + 1) + ' of ' + partFiles.length);
  });
  if (FORM.files.FAULT.file) steps.push('Uploading fault photo');
  if (FORM.files.REPORT.file) steps.push('Uploading service report');
  if (thenSubmit) { steps.push('Filing documents'); steps.push('Notifying administrator'); }
  return steps;
}

const STEP = { list: [], current: -1 };

function showStepper(steps) {
  STEP.list = steps;
  STEP.current = -1;
  openModal({
    title: 'Saving…',
    size: 'narrow',
    body: '<div class="stepper" id="stepper">' + steps.map(function (s, i) {
      return '<div class="step" data-step="' + i + '"><span class="dot"></span>' +
        '<span class="label">' + h(s) + '</span>' +
        '<span class="bar" hidden><i style="width:0"></i></span></div>';
    }).join('') + '</div>',
    actions: [],
    footNote: 'Please keep this window open.'
  });
}

function advanceStep(index) {
  STEP.current = index;
  const node = document.querySelector('[data-step="' + index + '"]');
  if (node) node.classList.add('now');
}
function completeStep(index) {
  const node = document.querySelector('[data-step="' + index + '"]');
  if (node) { node.classList.remove('now'); node.classList.add('done'); }
}
function failStep(index) {
  const node = document.querySelector('[data-step="' + index + '"]');
  if (node) { node.classList.remove('now'); node.classList.add('bad'); }
}
function stepProgress(index, pct) {
  const node = document.querySelector('[data-step="' + index + '"] .bar');
  if (!node) return;
  node.hidden = false;
  node.querySelector('i').style.width = Math.round(pct) + '%';
}

/** Uploads every pending file in sequence, advancing the stepper as it goes. */
function uploadAll(claim, startStep) {
  const jobs = [];
  const items = claim.items || [];

  FORM.items.forEach(function (formItem, index) {
    if (!formItem.file) return;
    const target = formItem.itemId
      ? items.filter(function (i) { return i.itemId === formItem.itemId; })[0]
      : items[index];
    jobs.push({ kind: 'PART', itemId: target ? target.itemId : '', file: formItem.file });
  });
  if (FORM.files.FAULT.file) jobs.push({ kind: 'FAULT', itemId: '', file: FORM.files.FAULT.file });
  if (FORM.files.REPORT.file) jobs.push({ kind: 'REPORT', itemId: '', file: FORM.files.REPORT.file });

  let step = startStep;
  let chain = Promise.resolve();

  // A file that fails does not abandon the ones after it, and it is never
  // silent: the claim is saved either way, so a lost upload would otherwise
  // leave a claim that looks complete and cannot be submitted.
  UPLOAD_FAILURES.length = 0;

  jobs.forEach(function (job) {
    const at = step++;
    chain = chain.then(function () {
      advanceStep(at);
      return prepareFile(job.file, function (pct) { stepProgress(at, pct); });
    }).then(function (prepared) {
      return api('claims.upload', {
        claimId: claim.claimId, kind: job.kind, itemId: job.itemId,
        data: prepared.data, fileName: prepared.name, mimeType: prepared.mimeType
      });
    }).then(function () { completeStep(at); })
      .catch(function (e) {
        failStep(at);
        UPLOAD_FAILURES.push(job.file.name + ' — ' + (e && e.message ? e.message : 'upload failed'));
      });
  });

  return chain.then(function () { return step; });
}

const UPLOAD_FAILURES = [];

/** Says which files did not make it, and stays on screen until dismissed. */
function reportUploadFailures() {
  if (!UPLOAD_FAILURES.length) return;
  const list = UPLOAD_FAILURES.slice();
  UPLOAD_FAILURES.length = 0;
  toast(list.length + ' file' + (list.length === 1 ? '' : 's') + ' could not be uploaded: ' +
    list.join('; ') + '. The claim was saved — open it and attach ' +
    (list.length === 1 ? 'it' : 'them') + ' again.', 'err');
}

/**
 * Reads a file as base64. Photos are resized first: base64 inflates by a third,
 * and a modern phone photo would otherwise make every submission crawl.
 */
function prepareFile(file, onProgress) {
  return new Promise(function (resolve, reject) {
    const isImage = /^image\//.test(file.type);
    const reader = new FileReader();
    reader.onprogress = function (e) {
      if (e.lengthComputable && onProgress) onProgress((e.loaded / e.total) * 60);
    };
    reader.onerror = function () { reject(new Error('Could not read ' + file.name)); };

    reader.onload = function () {
      if (!isImage) {
        if (onProgress) onProgress(100);
        resolve({
          data: String(reader.result).split(',')[1],
          name: file.name,
          mimeType: file.type || 'application/octet-stream'
        });
        return;
      }
      const img = new Image();
      img.onload = function () {
        const max = 1600;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        if (onProgress) onProgress(100);
        resolve({
          data: dataUrl.split(',')[1],
          name: file.name.replace(/\.[^.]+$/, '') + '.jpg',
          mimeType: 'image/jpeg'
        });
      };
      img.onerror = function () { reject(new Error('Could not read ' + file.name)); };
      img.src = String(reader.result);
    };
    reader.readAsDataURL(file);
  });
}

/* =========================================================== batches */

function loadBatches() {
  el('view').innerHTML = skeleton(4);
  const tab = S.tab === 'action' ? 'action' : S.tab;
  api('claims.list', Object.assign({ tab: tab }, S.filters)).then(function (data) {
    S.rows = data.rows;
    S.counts = data.counts;
    S.selection = {};
    renderBatches();
  }).catch(fail);
}

function renderBatches() {
  const batches = {};
  S.rows.forEach(function (c) {
    (batches[c.refNo || '—'] = batches[c.refNo || '—'] || []).push(c);
  });
  const refs = Object.keys(batches).sort().reverse();

  const html = [
    '<div class="tabs">',
    tabButton('action', 'Needs Action', S.counts.action),
    tabButton('progress', 'In Progress'),
    tabButton('completed', 'Completed'),
    tabButton('all', 'All'),
    '</div>',
    '<div class="toolbar">',
      '<input type="text" id="q" class="grow" placeholder="Search claim, serial number, customer…" value="' + h(S.filters.search) + '">',
      '<span class="spacer"></span>',
      '<button class="btn" id="doExport" type="button">Export to Excel</button>',
    '</div>',
    refs.length ? refs.map(function (ref) { return batchCard(ref, batches[ref]); }).join('')
      : '<div class="tablewrap"><div class="empty">Nothing waiting for you.</div></div>',
    '<div id="selbar"></div>'
  ].join('');

  el('view').innerHTML = html;
  wireBatches();
  renderSelectionBar();
}

function batchCard(ref, claims) {
  const parts = claims.reduce(function (n, c) { return n + c.items.length; }, 0);
  const pending = claims.reduce(function (n, c) { return n + c.summary.pending; }, 0);

  return '<div class="bulk"><div class="bulk-head">' +
      '<span class="ref">' + h(ref) + '</span>' +
      '<span class="tiny">' + claims.length + ' claim' + (claims.length === 1 ? '' : 's') +
        ' · ' + parts + ' part' + (parts === 1 ? '' : 's') + '</span>' +
      '<span class="spacer"></span>' +
      (pending ? '<button class="btn sm" data-approve-batch="' + h(ref) + '" type="button">' +
        'Approve All (' + pending + ')</button>' : '') +
    '</div>' +
    claims.map(function (c) {
      return '<div class="claim-blk">' +
        '<div class="row"><span class="mono" style="font-weight:600">' + h(c.claimId) + '</span>' +
          '<span>' + h(c.customerName) + '</span>' +
          '<span class="mono dim">' + h(c.serialNumber) + '</span>' +
          '<span class="mono dim">' + h(c.workOrderNo || '—') + '</span>' +
          '<span class="spacer"></span>' +
          '<button class="btn sm" data-open="' + h(c.claimId) + '" type="button">View Evidence</button>' +
        '</div>' +
        '<div class="warr">' + h(c.warrantyBasis) + '</div>' +
        (c.problem ? '<div class="tiny">“' + h(c.problem) + '”</div>' : '') +
        c.items.map(function (i) {
          const settled = [ITEM.FORWARDED, ITEM.AWAITING, ITEM.SHIPPED].indexOf(i.itemStatus) !== -1;
          return '<div class="itemrow">' +
            (settled ? '<span style="width:14px"></span>'
              : '<input type="checkbox" class="pick" value="' + h(i.itemId) + '"' +
                (S.selection[i.itemId] ? ' checked' : '') + '>') +
            '<span class="nm">' + h(i.partName) + '</span>' +
            '<span class="mono tiny">' + i.qty + ' pcs</span>' +
            itemPill(i.itemStatus) +
            (i.decisionReason ? '<span class="tiny">' + h(i.decisionReason) + '</span>' : '') +
            '</div>';
        }).join('') +
      '</div>';
    }).join('') + '</div>';
}

function wireBatches() {
  el('view').querySelectorAll('[data-tab]').forEach(function (b) {
    b.addEventListener('click', function () { S.tab = b.dataset.tab; loadBatches(); });
  });
  el('view').querySelectorAll('[data-open]').forEach(function (b) {
    b.addEventListener('click', function () { openClaimPanel(b.dataset.open); });
  });
  el('view').querySelectorAll('.pick').forEach(function (box) {
    box.addEventListener('change', function () {
      if (box.checked) S.selection[box.value] = true; else delete S.selection[box.value];
      renderSelectionBar();
    });
  });
  el('view').querySelectorAll('[data-approve-batch]').forEach(function (b) {
    b.addEventListener('click', function () {
      const ref = b.dataset.approveBatch;
      const ids = [];
      S.rows.filter(function (c) { return (c.refNo || '—') === ref; }).forEach(function (c) {
        c.items.forEach(function (i) { if (i.itemStatus === ITEM.PENDING) ids.push(i.itemId); });
      });
      if (!ids.length) return;
      if (!confirm('Approve all ' + ids.length + ' undecided parts in ' + ref + '?')) return;
      api('claims.decide', { itemIds: ids, decision: 'approve', reason: '' })
        .then(function () { toast(ids.length + ' parts approved.', 'ok'); loadBatches(); })
        .catch(fail);
    });
  });
  const q = el('q');
  if (q) {
    let timer = null;
    q.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { S.filters.search = q.value.trim(); loadBatches(); }, 350);
    });
  }
  const ex = el('doExport');
  if (ex) ex.addEventListener('click', doExport);
}

function renderSelectionBar() {
  const ids = Object.keys(S.selection);
  const host = el('selbar');
  if (!host) return;
  if (!ids.length) { host.innerHTML = ''; return; }

  const isAdmin = S.session.role === ROLE.ADMIN;
  host.innerHTML = '<div class="selbar"><b>' + ids.length + ' part' +
    (ids.length === 1 ? '' : 's') + ' selected</b><span class="spacer"></span>' +
    '<button class="btn sm ok" id="selApprove" type="button">Approve</button>' +
    '<button class="btn sm no" id="selReject" type="button">Reject</button>' +
    (isAdmin ? '<button class="btn sm" id="selAvail" type="button">Set Availability &amp; Document Ref</button>' +
      '<button class="btn sm pri" id="selForward" type="button">Forward Order…</button>' : '') +
    '</div>';

  el('selApprove').addEventListener('click', function () { bulkDecision('approve'); });
  el('selReject').addEventListener('click', function () { bulkDecision('reject'); });
  if (isAdmin) {
    el('selAvail').addEventListener('click', promptAvailability);
    el('selForward').addEventListener('click', promptForwardOrder);
  }
}

function bulkDecision(decision) {
  const ids = Object.keys(S.selection);
  openModal({
    title: decision === 'approve' ? 'Approve selected parts' : 'Reject selected parts',
    size: 'narrow',
    body: '<p>' + ids.length + ' part' + (ids.length === 1 ? '' : 's') + ' selected.</p>' +
      '<label class="field"><span>Reason' + (decision === 'reject' ? ' <b class="req">*</b>' : '') +
      '</span><textarea id="reason"></textarea></label>',
    actions: [
      { label: 'Cancel', close: true },
      { label: decision === 'approve' ? 'Approve' : 'Reject',
        primary: decision === 'approve', danger: decision === 'reject',
        onClick: function (close) {
          const reason = el('reason').value.trim();
          if (decision === 'reject' && !reason) { toast('A rejection must state its reason.', 'err'); return; }
          api('claims.decide', { itemIds: ids, decision: decision, reason: reason })
            .then(function () {
              close(); S.selection = {}; toast('Decision recorded.', 'ok');
              S.page === 'orders' ? loadOrders() : loadBatches();
            }).catch(fail);
        } }
    ]
  });
}

/* ============================================================ orders */

function loadOrders() {
  el('view').innerHTML = skeleton(4);
  api('claims.list', { tab: 'all' }).then(function (data) {
    S.rows = data.rows.filter(function (c) {
      return c.items.some(function (i) {
        return [ITEM.APPROVED, ITEM.FORWARDED, ITEM.AWAITING].indexOf(i.itemStatus) !== -1;
      });
    });
    S.selection = {};
    renderOrders();
  }).catch(fail);
}

function renderOrders() {
  if (!S.rows.length) {
    el('view').innerHTML = '<div class="tablewrap"><div class="empty">' +
      'No approved parts are waiting to be ordered.</div></div>';
    return;
  }

  const batches = {};
  S.rows.forEach(function (c) { (batches[c.refNo] = batches[c.refNo] || []).push(c); });

  const html = Object.keys(batches).sort().reverse().map(function (ref) {
    const claims = batches[ref];
    const groups = {};
    const loose = [];

    claims.forEach(function (c) {
      c.items.forEach(function (i) {
        if ([ITEM.APPROVED, ITEM.FORWARDED, ITEM.AWAITING].indexOf(i.itemStatus) === -1) return;
        const entry = { claim: c, item: i };
        if (i.documentRefNo) (groups[i.documentRefNo] = groups[i.documentRefNo] || []).push(entry);
        else loose.push(entry);
      });
    });

    return '<div class="bulk"><div class="bulk-head"><span class="ref">' + h(ref) + '</span>' +
      '<span class="tiny">' + claims.length + ' claim' + (claims.length === 1 ? '' : 's') + '</span>' +
      '</div>' +
      Object.keys(groups).map(function (doc) {
        const entries = groups[doc];
        const date = entries[0].item.availabilityDate;
        const readyToShip = entries.some(function (e) { return e.item.itemStatus !== ITEM.SHIPPED; });
        return '<div class="claim-blk">' +
          '<div class="shipgrp"><span class="pill flat p-rev">📦 ' + h(doc) + '</span>' +
            '<span>Available <b>' + h(fmtDate(date)) + '</b></span>' +
            '<span class="tiny">' + entries.length + ' part' + (entries.length === 1 ? '' : 's') + '</span>' +
            '<span class="spacer"></span>' +
            (readyToShip ? '<button class="btn sm" data-ship="' + h(doc) + '" type="button">Mark as Shipped</button>' : '') +
          '</div>' + entries.map(orderRow).join('') + '</div>';
      }).join('') +
      (loose.length
        ? '<div class="claim-blk"><div class="tiny" style="font-weight:600;letter-spacing:.08em;' +
          'text-transform:uppercase">Not yet scheduled</div>' + loose.map(orderRow).join('') + '</div>'
        : '') +
    '</div>';
  }).join('');

  el('view').innerHTML = '<div class="toolbar"><h2 style="margin:0;font-size:16px">Approved parts</h2>' +
    '<span class="spacer"></span><button class="btn" id="doExport" type="button">Export to Excel</button>' +
    '</div>' + html + '<div id="selbar"></div>';

  el('view').querySelectorAll('.pick').forEach(function (box) {
    box.addEventListener('change', function () {
      if (box.checked) S.selection[box.value] = true; else delete S.selection[box.value];
      renderSelectionBar();
    });
  });
  el('view').querySelectorAll('[data-open]').forEach(function (b) {
    b.addEventListener('click', function () { openClaimPanel(b.dataset.open); });
  });
  el('view').querySelectorAll('[data-ship]').forEach(function (b) {
    b.addEventListener('click', function () {
      const doc = b.dataset.ship;
      const ids = [];
      S.rows.forEach(function (c) {
        c.items.forEach(function (i) {
          if (i.documentRefNo === doc && i.itemStatus !== ITEM.SHIPPED) ids.push(i.itemId);
        });
      });
      if (!ids.length) return;
      api('claims.shipped', { itemIds: ids })
        .then(function () { toast(ids.length + ' part(s) marked as shipped.', 'ok'); loadOrders(); })
        .catch(fail);
    });
  });
  const ex = el('doExport');
  if (ex) ex.addEventListener('click', doExport);
  renderSelectionBar();
}

function orderRow(entry) {
  const i = entry.item;
  const c = entry.claim;
  const settled = i.itemStatus === ITEM.SHIPPED;
  return '<div class="itemrow">' +
    (settled ? '<span style="width:14px"></span>'
      : '<input type="checkbox" class="pick" value="' + h(i.itemId) + '"' +
        (S.selection[i.itemId] ? ' checked' : '') + '>') +
    '<span class="nm">' + h(i.partName) + ' · <span class="dim">' + h(c.customerName) + '</span></span>' +
    '<span class="mono tiny">' + i.qty + ' pcs</span>' +
    itemPill(i.itemStatus) +
    '<button class="btn sm ghost" data-open="' + h(c.claimId) + '" type="button">' +
      h(c.claimId) + '</button>' +
    '</div>';
}
