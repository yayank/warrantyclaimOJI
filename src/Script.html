  { id: 'recipients', label: 'Recipients' },
  { id: 'units', label: 'Units' }
];

function renderMaster(total) {
  const kind = S.master.kind;
  const rows = S.master.rows;
  const active = rows.filter(function (r) { return r.Active !== false; }).length;

  const head = {
    users: ['Email', 'Name', 'Role', 'Principal', 'Active', 'Claims', ''],
    principals: ['ID', 'Name', 'Active', 'Claims', ''],
    customers: ['ID', 'Name', 'Active', 'Claims', ''],
    parts: ['ID', 'Name', 'Active', 'Used in claims', ''],
    recipients: ['ID', 'Name', 'Email', 'Company', 'Principal', 'Active', ''],
    units: ['Serial number', 'Product', 'Principal', 'Selling in', 'Computed warranty']
  }[kind];

  const body = rows.map(function (r) {
    if (kind === 'units') {
      return '<tr><td class="mono">' + h(r.serialNumber) + '</td><td>' + h(r.product) + '</td>' +
        '<td' + (r.principal ? '' : ' class="dimmer"') + '>' +
          h(r.principal || 'unattributed') + '</td>' +
        '<td>' + h(r.sellingInDate) + '</td>' +
        '<td class="stack">' + warrantyPill(r.computedType) +
          '<span class="tiny">' + h(r.computedBasis) + '</span></td></tr>';
    }
    const cells = [];
    if (kind === 'users') {
      cells.push('<td class="mono">' + h(r.Email) + '</td>', '<td>' + h(r.Name) + '</td>',
        '<td>' + h(r.Role) + '</td>',
        '<td' + (r.Principal ? '' : ' class="dimmer"') + '>' +
          h(r.Principal || (r.Role === ROLE.PRINCIPAL ? 'required' : '—')) + '</td>');
    } else if (kind === 'recipients') {
      cells.push('<td class="mono">' + h(r.RecipientID) + '</td>', '<td>' + h(r.Name) + '</td>',
        '<td class="mono">' + h(r.Email) + '</td>', '<td>' + h(r.Company) + '</td>',
        '<td class="dim">' + h(r.Principal || '—') + '</td>');
    } else {
      const id = kind === 'parts' ? r.PartID
        : kind === 'principals' ? r.PrincipalID : r.CustomerID;
      cells.push('<td class="mono' + (r.Active ? '' : ' dimmer') + '">' + h(id) + '</td>',
        '<td class="' + (r.Active ? '' : 'dimmer') + '">' + h(r.Name) + '</td>');
    }
    cells.push('<td>' + (r.Active ? '<span class="pill p-ok">Active</span>'
      : '<span class="pill p-draft">Inactive</span>') + '</td>');
    if (kind !== 'recipients') cells.push('<td class="num">' + (r.__used || 0) + '</td>');
    cells.push('<td><button class="btn sm" data-edit="' + h(masterKey(kind, r)) + '" type="button">Edit</button></td>');
    return '<tr>' + cells.join('') + '</tr>';
  }).join('');

  el('view').innerHTML = [
    '<div class="tabs">' + MASTER_TABS.map(function (t) {
      return '<button type="button" data-master="' + t.id + '"' +
        (kind === t.id ? ' class="on"' : '') + '>' + h(t.label) + '</button>';
    }).join('') + '</div>',
    '<div class="toolbar">',
      '<span class="tiny">' + total + ' item' + (total === 1 ? '' : 's') +
        (kind === 'units' ? '' : ' · ' + active + ' active') + '</span>',
      '<span class="spacer"></span>',
      kind === 'units'
        ? '<button class="btn pri" id="importUnits" type="button">Import from Excel</button>'
        : '<button class="btn pri" id="addMaster" type="button">Add</button>',
    '</div>',
    '<div class="tablewrap"><table class="data"><thead><tr>' +
      head.map(function (x) { return '<th>' + h(x) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + body + '</tbody></table></div>',
    kind === 'units'
      ? '<div id="principalHealth"></div>' +
        '<p class="tiny">Unit data is read-only here. It arrives from the principal as a file, so it ' +
        'is replaced by import rather than edited row by row. Warranty is computed from the serial ' +
        'number; the Status column of the source sheet is never used.</p>'
      : '<p class="tiny">Entries are never deleted — deactivating one hides it from selection lists ' +
        'while older claims keep showing the name they were submitted with.</p>'
  ].join('');

  el('view').querySelectorAll('[data-master]').forEach(function (b) {
    b.addEventListener('click', function () { loadMaster(b.dataset.master); });
  });
  el('view').querySelectorAll('[data-edit]').forEach(function (b) {
    b.addEventListener('click', function () {
      const record = rows.filter(function (r) { return masterKey(kind, r) === b.dataset.edit; })[0];
      openMasterForm(kind, record);
    });
  });
  const add = el('addMaster');
  if (add) add.addEventListener('click', function () { openMasterForm(kind, null); });
  const imp = el('importUnits');
  if (imp) imp.addEventListener('click', promptImportUnits);

  // Units the population sheet cannot place reach no principal at all, so it is
  // worth saying so rather than letting them sit unnoticed.
  if (kind === 'units') {
    api('master.unknownPrincipals', {}).then(function (r) {
      const box = el('principalHealth');
      if (!box) return;
      const notes = [];
      if (r.unattributed) {
        notes.push(r.unattributed + ' unit' + (r.unattributed === 1 ? '' : 's') +
          ' have no principal in the Population sheet — claims on them cannot be forwarded ' +
          'until an administrator assigns one.');
      }
      r.unknown.forEach(function (u) {
        notes.push('"' + u.name + '" appears on ' + u.units + ' unit' +
          (u.units === 1 ? '' : 's') + ' but is not an active principal.');
      });
      box.innerHTML = notes.length
        ? '<div class="notice">⚠ ' + notes.map(h).join('<br>') + '</div>'
        : '';
    }).catch(function () { /* advisory only */ });
  }
}

function masterKey(kind, r) {
  return kind === 'users' ? r.Email
    : kind === 'parts' ? r.PartID
      : kind === 'customers' ? r.CustomerID
        : kind === 'principals' ? r.PrincipalID : r.RecipientID;
}

function principalSelect(id, value, includeBlank) {
  const names = S.reference.principals || [];
  return '<select id="' + id + '">' +
    (includeBlank ? '<option value="">— none —</option>' : '') +
    names.map(function (n) {
      return '<option value="' + h(n) + '"' + (value === n ? ' selected' : '') + '>' + h(n) + '</option>';
    }).join('') + '</select>';
}

function openMasterForm(kind, record) {
  const isNew = !record;
  let body = '';

  if (kind === 'users') {
    const roles = [ROLE.REQUESTER, ROLE.PRODUCTION, ROLE.ADMIN, ROLE.PRINCIPAL, ROLE.TESTER];
    body =
      '<label class="field"><span>Email</span><input type="email" id="mEmail" value="' +
        h(record ? record.Email : '') + '"' + (isNew ? '' : ' readonly') + '></label>' +
      '<label class="field"><span>Name</span><input type="text" id="mName" value="' +
        h(record ? record.Name : '') + '"></label>' +
      '<label class="field"><span>Role</span><select id="mRole">' + roles.map(function (r) {
        return '<option value="' + h(r) + '"' + (record && record.Role === r ? ' selected' : '') +
          '>' + h(r) + '</option>';
      }).join('') + '</select></label>' +
      '<label class="field"><span>Principal</span>' +
        principalSelect('mPrincipal', record ? record.Principal : '', true) + '</label>' +
      '<p class="tiny">Required for a Principal account — it decides which claims that account ' +
        'can see and which digests it receives. Ignored for every other role.</p>' +
      activeToggle(record);
  } else if (kind === 'recipients') {
    body =
      '<label class="field"><span>Name</span><input type="text" id="mName" value="' +
        h(record ? record.Name : '') + '"></label>' +
      '<label class="field"><span>Email</span><input type="email" id="mEmail" value="' +
        h(record ? record.Email : '') + '"></label>' +
      '<label class="field"><span>Company</span><input type="text" id="mCompany" value="' +
        h(record ? record.Company : '') + '"></label>' +
      '<label class="field"><span>Principal</span>' +
        principalSelect('mPrincipal', record ? record.Principal : '', true) + '</label>' +
      '<label class="field"><span>Notes</span><input type="text" id="mNotes" value="' +
        h(record ? record.Notes : '') + '"></label>' +
      activeToggle(record);
  } else {
    body =
      '<label class="field"><span>Name</span><input type="text" id="mName" value="' +
        h(record ? record.Name : '') + '"></label>' +
      activeToggle(record) +
      (record && record.__used
        ? '<div class="notice">⚠ ' + record.__used + ' existing claim' +
          (record.__used === 1 ? '' : 's') + ' keep the name they were submitted with. New claims ' +
          'will use the new name.</div>'
        : '');
  }

  openModal({
    title: (isNew ? 'Add ' : 'Edit ') + kind.replace(/s$/, ''),
    size: 'narrow',
    meta: record ? masterKey(kind, record) : '',
    body: body,
    actions: [
      { label: 'Cancel', close: true },
      { label: 'Save', primary: true, onClick: function (close) {
        const payload = { Active: el('mActive').checked };
        if (kind === 'users') {
          payload.Email = el('mEmail').value.trim().toLowerCase();
          payload.Name = el('mName').value.trim();
          payload.Role = el('mRole').value;
          payload.Principal = el('mPrincipal').value;
        } else if (kind === 'recipients') {
          payload.RecipientID = record ? record.RecipientID : '';
          payload.Name = el('mName').value.trim();
          payload.Email = el('mEmail').value.trim();
          payload.Company = el('mCompany').value.trim();
          payload.Principal = el('mPrincipal').value;
          payload.Notes = el('mNotes').value.trim();
        } else {
          if (kind === 'parts') payload.PartID = record ? record.PartID : '';
          else if (kind === 'principals') payload.PrincipalID = record ? record.PrincipalID : '';
          else payload.CustomerID = record ? record.CustomerID : '';
          payload.Name = el('mName').value.trim();
        }
        api('master.save', { kind: kind, record: payload })
          .then(function () {
            close(); toast('Saved.', 'ok');
            return api('session.bootstrap', {});
          })
          .then(function (data) { S.reference = data.reference; loadMaster(kind); })
          .catch(fail);
      } }
    ]
  });
}

function activeToggle(record) {

function render(text, data) {
  let out = String(text);
  out = out.replace(/\{\{#([A-Za-z]+)\}\}\n?([\s\S]*?)\{\{\/\1\}\}\n?/g, function (m, key, inner) {
    const list = data[key];
    if (!list || !list.length) return '';
    return list.map(function (row) { return render(inner, row); }).join('');
  });
  return out.replace(/\{\{([A-Za-z]+)\}\}/g, function (m, key) {
    return data[key] === undefined || data[key] === null ? '' : String(data[key]);
  });
}

function placeholderChips(template) {
  const found = {};
  const all = String(template.body + ' ' + template.subject);
  const known = ['ClaimID', 'RefNo', 'Customer', 'SerialNumber', 'WarrantyBasis', 'WorkOrder',
    'Problem', 'PartName', 'Qty', 'ItemStatus', 'DecisionReason', 'ClaimCount', 'PartCount',
    'ApprovedCount', 'RejectedCount', 'VerifiedBy', 'RequesterName', 'SubmittedAt', 'DecisionBy',
    'DecisionAt', 'ForwardedBy', 'ForwardedAt', 'ReturnReason', 'AmendedBy', 'AmendedAt',
    'Reason', 'Field', 'OldValue', 'NewValue'];
  known.forEach(function (k) { found['{{' + k + '}}'] = false; });
  (template.required || []).forEach(function (r) { found[r] = true; });

  return Object.keys(found).map(function (p) {
    return '<button type="button" class="' + (found[p] ? 'must' : '') + '">' + h(p) + '</button>';
  }).join('');
}

function insertPlaceholder(token) {
  const box = el('tBody');
  const start = box.selectionStart;
  box.value = box.value.slice(0, start) + token + box.value.slice(box.selectionEnd);
  box.focus();
  box.selectionStart = box.selectionEnd = start + token.length;
  updatePreview();
}

          return '<tr><td class="tiny">' + h(fmtDateTime(r.timestamp)) + '</td>' +
            '<td class="stack"><span>' + h(r.actor) + '</span><span class="tiny">' +
              h(r.simulatedRole ? r.role + ' → ' + r.simulatedRole : r.role) + '</span></td>' +
            '<td class="mono">' + h(r.claimId) + '</td>' +
            '<td>' + h(r.action) + '</td>' +
            '<td class="tiny">' + h(r.field) + '</td>' +
            '<td class="tiny">' + (r.oldValue || r.newValue
              ? h(r.oldValue || '(empty)') + ' → ' + h(r.newValue || '(empty)') : '') + '</td>' +
            '<td class="tiny">' + h(r.reason) + '</td></tr>';
        }).join('') +
      '</tbody></table></div>';
  }).catch(fail);
}
</script>
